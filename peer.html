<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>數金情報站 - 同業導入觀測</title>
<style>
:root{
  --plane:#f1f5f9; --surface:#ffffff;
  --ink:#0f172a; --ink-2:#475569; --muted:#94a3b8;
  --rule:#e2e8f0; --rule-soft:#f1f5f9;
  --nav:linear-gradient(135deg,#0f2460 0%,#1e3a8a 50%,#1e40af 100%);
  --navy:#1e3a8a; --accent:#ea580c; --accent-soft:#fff7ed;
  /* 狀態色為輔助，形狀才是主編碼：實心＝已導入、空心環＝宣示中。
     驗證過 已導入↔宣示中 在紅綠色盲下 ΔE 僅 5.4，顏色單獨不可辨，故一律配形狀。 */
  --done:#0ca30c; --claim:#d97706; --stop:#d03b3b; --none:#cbd5e1;
  --ai:#2a78d6; --fin:#7c3aed;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--plane);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.55}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.hidden{display:none !important}
.wrap{max-width:88rem;margin:0 auto;padding:0 1.5rem}

/* nav */
.navbar{background:var(--nav);position:sticky;top:0;z-index:50;box-shadow:0 2px 20px rgba(0,0,0,.25)}
.nav-container{max-width:88rem;margin:0 auto;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:3.5rem}
.logo{display:flex;align-items:center;gap:.625rem;text-decoration:none;color:#fff;font-size:.875rem;font-weight:700;letter-spacing:.1em;transition:color .2s}
.logo:hover{color:#fdba74}
.logo-icon{width:1.75rem;height:1.75rem;border-radius:.5rem;background:#f97316;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:1rem;height:1rem;color:#fff}
.nav-links{display:flex;gap:1.5rem;font-size:.875rem;font-weight:500}
.nav-link{display:flex;align-items:center;gap:.375rem;text-decoration:none;color:rgba(255,255,255,.75);transition:color .2s}
.nav-link:hover,.nav-link.active{color:#fdba74}
.nav-link svg{width:.875rem;height:.875rem}
@media(max-width:900px){.nav-links{display:none}}

.pagehead{padding:1.75rem 0 .25rem}
.pagehead h1{font-size:1.5rem;font-weight:700;color:var(--navy);letter-spacing:-.01em}
.pagehead p{font-size:.875rem;color:var(--ink-2);margin-top:.25rem;max-width:56rem}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin:1.25rem 0}
@media(max-width:900px){.tiles{grid-template-columns:repeat(2,1fr)}}
/* 日期是 10 個字，用 .v 的字級在兩欄手機版會折行 */
.tile .v .date{white-space:nowrap}
@media(max-width:620px){.tile .v .date{font-size:1.25rem;letter-spacing:-.01em}}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:.75rem;padding:1rem 1.125rem}
.tile.me{border-color:#fed7aa;background:linear-gradient(180deg,var(--accent-soft),var(--surface))}
.tile .k{font-size:.6875rem;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.tile .v{font-size:1.875rem;font-weight:700;line-height:1.15;margin-top:.375rem;letter-spacing:-.02em}
.tile .v small{font-size:.9375rem;font-weight:600;color:var(--muted);margin-left:.125rem}
.tile .s{font-size:.75rem;color:var(--ink-2);margin-top:.25rem}
.tile.me .v{color:var(--accent)}

.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--rule);margin-top:.5rem;flex-wrap:wrap}
.tab{padding:.625rem 1rem;font-size:.875rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s}
.tab:hover{color:var(--ink-2)}
.tab.active{color:var(--navy);border-bottom-color:var(--navy)}

.panel{padding:1.5rem 0 3rem}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:.75rem}
.card-pad{padding:1.25rem}
.sec-title{font-size:.6875rem;font-weight:700;letter-spacing:.09em;color:var(--muted);text-transform:uppercase;margin-bottom:.75rem}
.h3{font-size:.9375rem;font-weight:700;color:var(--ink)}

.controls{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem;margin-bottom:1rem}
.seg{display:inline-flex;background:#e8edf4;border-radius:.5rem;padding:2px;flex-wrap:wrap}
.seg button{padding:.3125rem .75rem;font-size:.8125rem;font-weight:600;color:var(--ink-2);border-radius:.375rem;transition:.15s}
.seg button.on{background:var(--surface);color:var(--navy);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toggle{display:inline-flex;align-items:center;gap:.375rem;padding:.3125rem .75rem;font-size:.8125rem;font-weight:600;
  color:var(--ink-2);background:var(--surface);border:1px solid var(--rule);border-radius:.5rem;transition:.15s}
.toggle:hover{border-color:#cbd5e1}
.toggle.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* ── 圓點列 ────────────────────────────────────────────────────────────
   方塊網格會被讀成座位表；圓點串在一條淡軸線上，眼睛沿著列掃而不是逐格數。 */
.dotwrap{overflow-x:auto}
.dotgrid{min-width:60rem}
.dot-row{display:grid;grid-template-columns:15.5rem minmax(34rem,1fr) 5rem;align-items:center;gap:.875rem}
.dot-head{padding-bottom:.5rem;border-bottom:1px solid var(--rule);margin-bottom:.25rem}
.dot-track{display:grid;grid-template-columns:repeat(12,1fr);align-items:center;position:relative}
.dot-track.axis::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--rule-soft)}
/* 元大是本頁的比較基準，用淡色直帶標出所在欄，但圓點大小與其他 11 家一致 */
.dot-track::after{content:"";position:absolute;top:-2px;bottom:-2px;left:0;width:calc(100%/12);
  background:var(--accent-soft);border-radius:4px;z-index:0}
.dot-cell{display:flex;justify-content:center;position:relative;z-index:1;padding:.5rem 0}
.dot{width:15px;height:15px;border-radius:50%;cursor:pointer;transition:transform .12s;
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;line-height:1}
.dot:hover{transform:scale(1.45)}
.d-done{background:var(--done)}
.d-claim{background:#fff;box-shadow:inset 0 0 0 3px var(--claim)}   /* 空心環＝說了還沒做 */
.d-stop{background:var(--stop)}
.d-none{background:#fff;box-shadow:inset 0 0 0 1.5px var(--none)}
.d-none:hover{box-shadow:inset 0 0 0 1.5px var(--muted)}
.dot.stale{opacity:.4}
.dot-col-label{font-size:.75rem;font-weight:600;color:var(--ink-2);white-space:nowrap;text-align:center;
  cursor:pointer;padding:.125rem 0;border-radius:.25rem;position:relative;z-index:1}
.dot-col-label:hover{color:var(--navy);text-decoration:underline}
.dot-col-label.is-me{color:var(--accent)}
.row-label{min-width:0;text-align:left}
.row-label button{text-align:left;width:100%;padding:.1875rem .375rem;margin:-.1875rem -.375rem;border-radius:.375rem;transition:background .12s}
.row-label button:hover{background:#eff6ff}
.row-label .nm{font-size:.8125rem;font-weight:600;color:var(--ink)}
.row-label button:hover .nm{color:var(--navy)}
.row-label .id{font-size:.6875rem;color:var(--muted);margin-right:.3125rem;font-variant-numeric:tabular-nums}
.dot-count{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.dot-count b{font-size:.9375rem}
.dot-count span{font-size:.75rem;color:var(--muted)}
.dot-count-head{font-size:.75rem;font-weight:700;color:var(--muted);white-space:nowrap;text-align:right}
.band{display:flex;align-items:baseline;gap:.5rem;margin:1.125rem 0 .125rem}
.band-bar{display:inline-block;width:4px;height:14px;border-radius:2px;flex-shrink:0}
.band-label{font-size:.8125rem;font-weight:700;color:var(--ink)}
.band-hint{font-size:.75rem;color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:1rem;align-items:center;font-size:.75rem;color:var(--ink-2)}
.legend span.li{display:inline-flex;align-items:center;gap:.4375rem}
.swatch{width:15px;height:15px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff}
.swatch.done{background:var(--done)}
.swatch.claim{background:#fff;box-shadow:inset 0 0 0 3px var(--claim)}
.swatch.stop{background:var(--stop)}
.swatch.none{background:#fff;box-shadow:inset 0 0 0 1.5px var(--none)}

.notes{margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--rule);font-size:.75rem;color:var(--ink-2);line-height:1.8}
.notes p{margin-bottom:.375rem}
.notes b{color:var(--ink)}
.notes .swatch{vertical-align:middle;margin-right:.5rem;width:12px;height:12px}

/* gap card */
.gaplist{display:flex;flex-direction:column;gap:.125rem}
.gaprow{display:flex;align-items:center;gap:.75rem;padding:.5rem;border-radius:.5rem;text-align:left;width:100%;transition:background .15s}
.gaprow:hover{background:var(--accent-soft)}
.gaprow .nm{font-size:.8125rem;font-weight:600;flex:0 0 13rem;min-width:0}
.gaprow .nm i{font-style:normal;font-size:.6875rem;color:var(--muted);margin-right:.3125rem}
.gaprow .track{flex:1;height:6px;background:var(--rule);border-radius:3px;overflow:hidden;min-width:3rem}
.gaprow .track i{display:block;height:100%;background:var(--stop);border-radius:3px}
.gaprow .cnt{font-size:.75rem;color:var(--ink-2);font-variant-numeric:tabular-nums;width:6rem;text-align:right}

/* ranked list */
.rank{display:flex;align-items:flex-start;gap:.75rem;padding:.75rem .5rem;border-bottom:1px solid var(--rule-soft);width:100%;text-align:left;transition:background .15s}
.rank:last-child{border-bottom:0}
.rank:hover{background:var(--rule-soft)}
.rank .ord{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;width:1.25rem;flex-shrink:0;padding-top:.125rem}
.rank .g{font-size:.875rem;font-weight:700;width:5.5rem;flex-shrink:0}
.rank.me .g{color:var(--accent)}
.rank .body{flex:1;min-width:0}
.rank .desc{font-size:.8125rem;color:var(--ink-2);margin-top:.125rem}
.rank .when{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;flex-shrink:0;width:5.5rem;text-align:right}

.chip{display:inline-flex;align-items:center;gap:.25rem;font-size:.6875rem;font-weight:700;padding:.0625rem .4375rem;border-radius:999px;white-space:nowrap}
.chip.done{background:#e7f6e7;color:#0a7a0a}
.chip.claim{background:#fdf3e3;color:#9a5b06}
.chip.stop{background:#fdeaea;color:#a82e2e}
.chip.none{background:var(--rule-soft);color:var(--muted)}
.chip.stale{background:#fef6e7;color:#8a6516}
.chip.ai{background:#e8f1fc;color:#1d5ba6}
.chip.fin{background:#f1ecfd;color:#5b28c4}
.tag{display:inline-block;font-size:.6875rem;color:var(--ink-2);background:var(--rule-soft);
  border:1px solid var(--rule);padding:.0625rem .375rem;border-radius:.25rem}

/* ── 時間線：一欄一個月，一點一次佐證 ───────────────────────────── */
.tl{display:flex;align-items:flex-end;gap:2px;overflow-x:auto}
.tl-col{display:flex;flex-direction:column-reverse;align-items:center;gap:2px;flex:1;min-width:13px;
  border-radius:3px;transition:background .12s;padding-bottom:2px}
.tl-col.hit{cursor:pointer}
.tl-col.hit:hover,.tl-col.on{background:#e8f1fc}
.tl-dot{width:9px;height:9px;border-radius:50%;display:block}
.tl-ticks{display:flex;gap:2px;border-top:1px solid var(--rule);margin-top:.25rem;padding-top:.25rem}
.tl-ticks div{flex:1;min-width:13px;text-align:center;font-size:.5625rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tl-ticks div.off{visibility:hidden}

/* ── 誰在做、誰先做：一列一家，右側逐季長條 ───────────────────────── */
.lad{display:flex;align-items:center;gap:.625rem;padding:.5rem .25rem;border-bottom:1px solid var(--rule-soft)}
.lad:last-of-type{border-bottom:0}
.lad:hover{background:var(--rule-soft)}
.lad-i{width:1.25rem;flex-shrink:0;font-size:.75rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.lad-g{width:5.25rem;flex-shrink:0;font-size:.8125rem;font-weight:700;text-align:left}
.lad-g:hover{color:var(--navy);text-decoration:underline}
.lad-g.me{color:var(--accent)}
.lad-s{width:4.75rem;flex-shrink:0}
.lad-m{width:8.5rem;flex-shrink:0;font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lad-more{flex-shrink:0;font-size:.75rem;font-weight:600;color:var(--ai);opacity:0;transition:opacity .12s}
.lad:hover .lad-more{opacity:1}
.qstrip{flex:1;display:flex;gap:2px;min-width:8rem}
.qcell{flex:1;height:14px;border-radius:3px;background:var(--rule-soft);min-width:6px}
.qcell.done{background:var(--done);cursor:pointer}
.qcell.claim{background:#fff;box-shadow:inset 0 0 0 2px var(--claim);cursor:pointer}
.qkey{display:inline-block;width:14px;height:10px;border-radius:2px;background:var(--rule-soft);
  vertical-align:middle;margin:0 .125rem}
.qkey.done{background:var(--done)}
.qkey.claim{background:#fff;box-shadow:inset 0 0 0 2px var(--claim)}
/* 左側四欄是固定寬，窄螢幕塞不下會把季度條擠出卡片外，整組一起橫向捲 */
.lad-wrap{overflow-x:auto}
.lad-inner{min-width:36rem}
.qaxis{display:flex;align-items:flex-end;gap:.625rem;padding:.25rem .25rem .375rem;border-bottom:1px solid var(--rule)}
.qaxis-spacer{width:21.625rem;flex-shrink:0}
.qaxis-track{flex:1;display:flex;gap:2px;min-width:8rem}
.qaxis-track span{flex:1;min-width:6px;text-align:center;font-size:.5625rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

/* 能力與場景合併後的主視圖 */
.map-intro{display:flex;align-items:flex-start;justify-content:space-between;gap:1.5rem;flex-wrap:wrap}
.map-key{display:grid;grid-template-columns:auto 1fr;gap:.25rem .625rem;font-size:.75rem;color:var(--ink-2)}
.map-key b{color:var(--ink)}
.cap-band{margin-top:1.25rem;border-top:1px solid var(--rule);padding-top:1rem}
.cap-band:first-child{margin-top:.5rem;border-top:0;padding-top:0}
.cap-band-head{display:flex;align-items:flex-start;gap:.75rem;margin-bottom:.375rem}
.cap-code{font-size:.6875rem;font-weight:800;color:#fff;background:var(--navy);border-radius:.375rem;padding:.1875rem .4375rem;flex-shrink:0}
.cap-code.fin{background:var(--fin)}
.cap-band-title{font-size:.875rem;font-weight:700}
.cap-band-def{font-size:.6875rem;color:var(--muted);margin-top:.125rem}
.scene-path{font-size:.6875rem;color:var(--muted);margin-right:.375rem}
.scene-filter{display:flex;gap:.375rem;flex-wrap:wrap}
.scene-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1rem}
.scene-card{border:1px solid var(--rule);border-radius:.75rem;background:var(--surface);padding:1rem;min-width:0}
.scene-card:hover{border-color:#bfdbfe;box-shadow:0 4px 14px rgba(30,58,138,.06)}
.scene-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.scene-card-title{text-align:left;font-size:.9375rem;font-weight:700;color:var(--ink)}
.scene-card-title:hover{color:var(--navy)}
.scene-card-meta{font-size:.6875rem;color:var(--muted);margin-top:.1875rem}
.scene-total{font-size:1.25rem;font-weight:750;color:var(--navy);line-height:1;text-align:right;white-space:nowrap}
.scene-total small{display:block;font-size:.625rem;font-weight:600;color:var(--muted);margin-top:.25rem}
.scene-caps{display:flex;gap:.25rem;flex-wrap:wrap;margin-top:.75rem;padding-bottom:.75rem;border-bottom:1px solid var(--rule-soft)}
.peer-list{display:flex;gap:.375rem;flex-wrap:wrap;margin-top:.75rem}
.peer-pill{display:inline-flex;align-items:center;gap:.3125rem;border:1px solid var(--rule);border-radius:999px;padding:.1875rem .5rem;font-size:.6875rem;color:var(--ink-2);background:#fff}
.peer-pill:hover{border-color:#93c5fd;color:var(--navy);background:#eff6ff}
.peer-pill.me{border-color:#fed7aa;color:var(--accent);background:var(--accent-soft)}
.peer-state{width:7px;height:7px;border-radius:50%;background:var(--done);flex-shrink:0}
.peer-state.claim{background:#fff;box-shadow:inset 0 0 0 2px var(--claim)}
.peer-state.stop{background:var(--stop)}
.peer-q{color:var(--muted);font-variant-numeric:tabular-nums}
@media(max-width:820px){.scene-board{grid-template-columns:1fr}}
.cross-wrap{overflow-x:auto;margin-top:1rem}
.cross-grid{min-width:64rem;display:grid;grid-template-columns:11rem repeat(6,minmax(8rem,1fr));border:1px solid var(--rule);border-radius:.75rem;overflow:hidden;background:var(--surface)}
.cross-corner,.cross-head,.cross-rowhead,.cross-cell{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);min-width:0}
.cross-head{padding:.625rem .375rem;text-align:center;font-size:.6875rem;font-weight:700;color:var(--ink-2);background:var(--rule-soft);display:flex;align-items:center;justify-content:center}
.cross-corner{padding:.625rem;background:var(--rule-soft);font-size:.625rem;color:var(--muted);display:flex;align-items:center}
.cross-rowhead{padding:.75rem;font-size:.75rem;font-weight:700;display:flex;align-items:center;background:#fff}
.cross-cell{min-height:7rem;padding:.5rem;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:.375rem;transition:.12s;position:relative}
.cross-cell:hover{box-shadow:inset 0 0 0 2px #93c5fd;z-index:1}
.cross-cell.on{box-shadow:inset 0 0 0 3px var(--navy);z-index:2}
.cross-count{display:flex;align-items:baseline;justify-content:center;gap:.25rem;min-height:1.25rem}
.cross-cell .cn{font-size:1.0625rem;font-weight:750;color:var(--navy);line-height:1}
.cross-cell .cl{font-size:.5625rem;color:var(--ink-2)}
.cross-cell .cc{font-size:.5625rem;color:var(--claim)}
.cg-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;width:100%}
.cg-mini{display:block;min-width:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:.25rem;padding:2px 1px;font-size:.5625rem;font-weight:700;border:1px solid transparent;background:#e7f6e7;color:#0a7a0a}
.cg-mini.claim{background:#fff;border-color:var(--claim);color:#9a5b06}
.cg-mini.stop{background:#fdeaea;color:#a82e2e}
.cg-mini.me{box-shadow:0 0 0 1px var(--accent)}
.cross-empty{font-size:.625rem;color:var(--muted);text-align:center;margin:auto}
.cross-detail{display:grid;grid-template-columns:minmax(14rem,.8fr) minmax(24rem,1.2fr);gap:1.25rem;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--rule)}
.cross-label{font-size:.6875rem;color:var(--muted);margin-top:.75rem;margin-bottom:.3125rem}
@media(max-width:820px){.cross-detail{grid-template-columns:1fr}}
.dim-wrap{overflow:hidden;margin-top:1rem;border:1px solid var(--rule);border-radius:.75rem}
.dim-table{width:100%;min-width:0;table-layout:fixed;border-collapse:separate;border-spacing:0;background:#fff;font-size:.75rem}
.dim-table th,.dim-table td{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:.5rem;text-align:center}
.dim-table tr:last-child td,.dim-table tr:last-child th{border-bottom:0}
.dim-table th:last-child,.dim-table td:last-child{border-right:0}
.dim-table thead th{background:var(--rule-soft);color:var(--ink-2);font-weight:700}
.dim-table .super{font-size:.6875rem;letter-spacing:.04em;color:var(--navy)}
.dim-table .super.cap{color:var(--fin)}
.dim-table .dimension{position:sticky;left:0;z-index:2;width:13rem;background:#fff;text-align:left;font-size:.75rem}
.dim-table thead .dimension{background:var(--rule-soft);z-index:3}
.dim-table .company-head{font-size:.6875rem;white-space:nowrap;padding:.5rem .125rem}
.dim-table .company-head.me{color:var(--accent);background:var(--accent-soft)}
.dim-cell{width:100%;min-height:2.7rem;border-radius:.375rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.125rem;transition:.12s}
.dim-cell:hover{background:#eff6ff;box-shadow:inset 0 0 0 1px #93c5fd}
.dim-cell.on{background:#dbeafe;box-shadow:inset 0 0 0 2px var(--navy)}
.dim-state{width:10px;height:10px;border-radius:50%;background:var(--done)}
.dim-state.claim{background:#fff;box-shadow:inset 0 0 0 2px var(--claim)}
.dim-state.stop{background:var(--stop)}

.dim-q{font-size:.5625rem;color:var(--muted);font-variant-numeric:tabular-nums}

.dim-table .dimension.capability .dim-head-label{display:inline-flex;align-items:center;justify-content:center;max-width:none;white-space:nowrap;background:#fff;border:1px solid #cbd5e1;border-radius:999px;padding:.25rem .5rem;color:var(--ink-2)}

@media(max-width:900px){

}
.tri-legend{display:flex;flex-wrap:wrap;gap:.375rem;margin-top:1rem}
.tri-key{display:inline-flex;align-items:center;gap:.3125rem;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:.1875rem .5rem;font-size:.6875rem;color:var(--ink-2)}
.tri-key i{width:8px;height:8px;border-radius:50%;background:var(--cap-color);flex-shrink:0}
.tri-cell{display:grid;grid-template-columns:repeat(5,12px);justify-content:center;gap:5px 6px;min-height:2.75rem;align-content:center}
.tri-dot{width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:inset 0 0 0 1px var(--none);transition:transform .12s;position:relative}
.tri-dot:hover{transform:scale(1.45);z-index:2}
.tri-dot.done{background:var(--cap-color);box-shadow:none}
.tri-dot.claim{background:#fff;box-shadow:inset 0 0 0 2px var(--cap-color)}
.tri-dot.stop{background:var(--stop);box-shadow:none}
.tri-dot.stop::after{content:"×";position:absolute;inset:-3px 0 0;color:#fff;font-size:9px;font-weight:800;text-align:center}
.tri-dot.on{outline:2px solid var(--ink);outline-offset:2px}
.tri-state-note{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.625rem;font-size:.6875rem;color:var(--muted)}

.scene-panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;margin-top:1rem}
.scene-panel{background:#fff;border:1px solid var(--rule);border-radius:.75rem;padding:1rem;min-width:0}

.scene-panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;margin-bottom:.625rem}

.scene-panel-title:hover{text-decoration:underline}
.scene-panel-sub{font-size:.6875rem;color:var(--muted);margin-top:.125rem}
.panel-grid{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:.625rem}
.panel-grid th,.panel-grid td{border-bottom:1px solid var(--rule-soft);padding:.25rem .125rem;text-align:center}
.panel-grid tr:last-child th,.panel-grid tr:last-child td{border-bottom:0}
.panel-grid .pg-company{width:5.25rem;text-align:left;font-size:.6875rem;white-space:nowrap;color:var(--ink-2)}
.panel-grid .pg-company.me{color:var(--accent);font-weight:750}
.panel-grid .pg-cap{color:var(--muted);font-weight:700;height:1.75rem}
.panel-grid .tri-dot{display:inline-block}
.fingerprint{overflow:hidden;border:1px solid var(--rule);border-radius:.75rem;margin-top:.75rem}
.fingerprint .panel-grid{font-size:.75rem}
.fingerprint .panel-grid th,.fingerprint .panel-grid td{padding:.5rem .25rem}
.fingerprint .panel-grid .pg-company{width:12rem;font-size:.75rem;font-weight:700;padding-left:.75rem}
.fingerprint .panel-grid .pg-cap{font-size:.6875rem;background:var(--rule-soft);height:auto}
/* 策略指紋只用狀態色，避免「資訊安全的能力紅色」被誤讀成暫停。 */
.fingerprint .tri-dot{--cap-color:var(--done)}
.fingerprint .tri-dot.claim{--cap-color:var(--claim)}
@media(max-width:900px){.scene-panels{grid-template-columns:1fr}.scene-panel{padding:.75rem}}

/* 六大場景總覽：一次聚焦一個場景，讓 13 個能力項可以用完整名稱逐列比較 12 家集團。 */
.focus-scenes{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:.5rem;margin-top:1rem}
.focus-scene{min-width:0;border:1px solid var(--rule);border-radius:.625rem;background:#fff;padding:.625rem .75rem;text-align:left;transition:.15s}
.focus-scene:hover{border-color:#93c5fd;background:#f8fbff}
.focus-scene.on{border-color:var(--navy);background:#eff6ff;box-shadow:inset 0 -3px 0 var(--navy)}
.focus-scene-name{display:block;font-size:.75rem;font-weight:750;color:var(--ink);line-height:1.35}
.focus-scene.on .focus-scene-name{color:var(--navy)}
.focus-scene-meta{display:flex;align-items:center;justify-content:space-between;gap:.375rem;margin-top:.375rem;font-size:.625rem;color:var(--muted)}
.focus-scene-meter{display:block;height:3px;background:var(--rule);border-radius:2px;overflow:hidden;margin-top:.375rem}
.focus-scene-meter i{display:block;height:100%;background:var(--navy);border-radius:2px}
.focus-board{margin-top:1rem;border:1px solid var(--rule);border-radius:.75rem;overflow:hidden;background:#fff}
.focus-board-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;padding:.875rem 1rem;background:var(--rule-soft);border-bottom:1px solid var(--rule)}
.focus-board-title{font-size:1rem;font-weight:750;color:var(--navy)}
.focus-board-sub{font-size:.6875rem;color:var(--muted);margin-top:.125rem}
.focus-table-wrap{overflow-x:auto}
.focus-table{width:100%;min-width:58rem;border-collapse:collapse;table-layout:fixed}
.focus-table th,.focus-table td{border-bottom:1px solid var(--rule-soft);padding:.5rem .25rem;text-align:center}
.focus-table tr:last-child th,.focus-table tr:last-child td{border-bottom:0}
.focus-table thead th{height:2.5rem;background:#fff;font-size:.6875rem;color:var(--ink-2);font-weight:700;white-space:nowrap}
.focus-table .focus-cap-head{width:12.5rem;text-align:left;padding-left:1rem;color:var(--muted)}
.focus-table .focus-company{cursor:pointer;border-radius:.25rem;padding:.125rem .1875rem;font-size:.6875rem;font-weight:700;color:var(--ink-2)}
.focus-table .focus-company:hover{color:var(--navy);background:#eff6ff}
.focus-table .focus-company.me{color:var(--accent);background:var(--accent-soft)}
.focus-table .focus-cap-head,.focus-table .focus-cap{position:sticky;left:0;z-index:1;background:#fff;box-shadow:1px 0 0 var(--rule-soft)}
.focus-table .focus-cap-head{z-index:2}
.focus-table .focus-cap{width:12.5rem;text-align:left;padding-left:1rem;font-size:.75rem;color:var(--ink);font-weight:700}
.focus-cap-label{display:flex;align-items:center;gap:.5rem}
.focus-cap-label i{width:8px;height:8px;border-radius:50%;background:var(--cap-color);flex-shrink:0}
.focus-cap-button{width:100%;text-align:left;border-radius:.375rem;padding:.25rem .375rem;margin:-.25rem -.375rem;transition:.12s}
.focus-cap-button:hover,.focus-cap-button.on{background:#eff6ff;color:var(--navy)}
.focus-table .focus-total{width:5rem;text-align:right;padding-right:1rem;font-size:.6875rem;color:var(--muted);white-space:nowrap}
.focus-table .focus-total b{font-size:.8125rem;color:var(--ink)}
.focus-table td.me{background:linear-gradient(90deg,transparent,var(--accent-soft),transparent)}
.focus-table .tri-dot{display:inline-block;width:14px;height:14px;--cap-color:var(--done)}
.focus-table .tri-dot.claim{--cap-color:var(--claim)}
.focus-table tbody tr.focus-side{background:var(--rule-soft)}
.focus-table tbody tr.focus-side:hover{background:var(--rule-soft)}
.focus-table tbody tr.focus-side td{border-bottom-color:var(--rule)}
.focus-table .focus-side-label{font-size:.75rem;font-weight:800;letter-spacing:.04em;background:var(--rule-soft)}
.focus-table tr.focus-side.ai .focus-side-label{color:var(--ai)}
.focus-table tr.focus-side.fin .focus-side-label{color:var(--fin)}
.focus-table .focus-side-note{font-size:.625rem;color:var(--muted);letter-spacing:.06em}
.focus-table tbody tr:hover{background:#f8fafc}
.focus-table tbody tr:hover .focus-cap{color:var(--navy);background:#f8fafc}
@media(max-width:1000px){.focus-scenes{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.focus-scenes{display:flex;overflow-x:auto;padding-bottom:.25rem}.focus-scene{flex:0 0 9rem}.focus-board-head{padding:.75rem}}

/* 單家：季度 × 子公司策略導入圖 */
.strategy-grid{overflow-x:auto;padding-bottom:.25rem}
.strategy-panorama-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.strategy-panorama-head p{max-width:52rem}
.panorama-filter{margin-top:.875rem;padding:.75rem;background:var(--rule-soft);border-radius:.625rem}
.panorama-filter-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.5rem}
.panorama-filter-label{font-size:.6875rem;font-weight:750;color:var(--ink-2)}
.panorama-filter-hint{font-size:.625rem;color:var(--muted)}
.panorama-filter-group+.panorama-filter-group{margin-top:.75rem;padding-top:.75rem;border-top:1px solid var(--rule)}
.panorama-filter-group-label{display:block;font-size:.625rem;font-weight:750;color:var(--muted);margin-bottom:.375rem}
.panorama-filter.is-compact{padding:.625rem .75rem;background:#fff;border:1px solid var(--rule)}
.panorama-filter.is-compact .panorama-filter-group{display:flex;align-items:center;gap:.625rem}
.panorama-filter.is-compact .panorama-filter-group-label{margin:0;white-space:nowrap}
.panorama-advanced{margin-top:.625rem}
.panorama-advanced>summary{display:inline-flex;align-items:center;gap:.375rem;font-size:.6875rem;font-weight:700;color:var(--muted);cursor:pointer;list-style:none}
.panorama-advanced>summary::-webkit-details-marker{display:none}
.panorama-advanced>summary::after{content:"＋";font-size:.75rem}
.panorama-advanced[open]>summary::after{content:"－"}
.panorama-advanced-body{margin-top:.625rem;padding:.625rem;background:var(--rule-soft);border-radius:.5rem}
.strategy-section{margin-top:1.125rem;padding-top:1.125rem;border-top:1px solid var(--rule)}
.strategy-section:first-of-type{margin-top:1rem;padding-top:0;border-top:0}
.strategy-section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:.75rem}
.strategy-section-kicker{font-size:.625rem;font-weight:800;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.strategy-section-title{font-size:.875rem;font-weight:750;color:var(--ink);margin-top:.125rem}
.strategy-section-note{font-size:.6875rem;color:var(--muted);margin-top:.125rem;max-width:50rem}
/* 單一策略地圖：縱軸把六大場景展開為子公司泳道，橫軸共用季度。 */
.pm-scene-toolbar{display:flex;align-items:center;gap:.375rem;flex-wrap:wrap;margin-top:.875rem;padding:.625rem .75rem;border:1px solid var(--rule);border-radius:.625rem;background:#fff}
.pm-scene-toolbar-label{font-size:.625rem;font-weight:800;letter-spacing:.05em;color:var(--muted);margin-right:.25rem}
.pm-scene-filter{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .5rem;border:1px solid transparent;border-radius:999px;font-size:.6875rem;color:var(--ink-2);transition:.15s}
.pm-scene-filter i{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--ink-2));box-shadow:0 0 0 2px var(--tint,#fff)}
.pm-scene-count{min-width:1.1rem;padding:0 .3rem;border-radius:999px;background:var(--rule-soft);color:var(--muted);
  font-size:.625rem;font-weight:750;line-height:1.45;text-align:center;font-variant-numeric:tabular-nums}
.pm-scene-filter.on .pm-scene-count{background:rgba(255,255,255,.72);color:inherit}
.pm-scene-filter:hover{background:var(--rule-soft)}
.pm-scene-filter.on{border-color:var(--sc,var(--navy));background:var(--tint,#eff6ff);color:var(--ink);font-weight:750}
.pm-chart{overflow-x:auto;margin-top:.625rem;border:1px solid var(--rule);border-radius:.75rem;background:#fff}
.pm-inner{min-width:48rem}
.pm-row{display:grid;grid-template-columns:14rem minmax(34rem,1fr);align-items:stretch;border-bottom:1px solid var(--rule-soft)}
.pm-row:last-child{border-bottom:0}
.pm-axis{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--rule)}
.pm-axis-label,.pm-label{position:sticky;left:0;z-index:2;background:#fff;border-right:1px solid var(--rule-soft)}
.pm-axis-label{padding:.625rem .875rem;font-size:.6875rem;font-weight:700;color:var(--muted)}
.pm-label-cols{display:grid;grid-template-columns:10.5rem minmax(0,1fr);gap:.75rem;align-items:center}
.pm-label-cols span:last-child{padding-left:.75rem;border-left:1px solid var(--rule-soft)}
.pm-axis-track,.pm-track{display:grid;position:relative;align-items:center}
.pm-quarter{text-align:center;padding:.625rem .125rem;font-size:.625rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pm-quarter.is-year-start{border-left:1px solid #cbd5e1;color:var(--ink-2);font-weight:750}
.pm-quarter.is-latest{background:#f8fafc;color:var(--navy)}
.pm-scene{background:#f8fafc;border-top:1px solid var(--rule)}
.pm-scene:first-of-type{border-top:0}
.pm-scene .pm-label{background:#f8fafc;padding:.625rem .875rem}
.pm-scene-name{display:block;text-align:left;font-size:.8125rem;font-weight:800;color:var(--navy)}
.pm-scene-name:hover{text-decoration:underline}
.pm-scene-meta{display:block;font-size:.625rem;color:var(--muted);margin-top:.125rem}
.pm-scene-track{display:flex;align-items:center;padding:.375rem .625rem;background:#f8fafc}
.pm-scene-summary{font-size:.625rem;color:var(--muted)}
.pm-lane{min-height:3.25rem}
.pm-lane.is-empty{opacity:.45}
.pm-lane:hover,.pm-lane:hover .pm-label{background:#f8fbff}
.pm-label{padding:.625rem .875rem;min-width:0}
.pm-lane-label{display:grid;grid-template-columns:10.5rem minmax(0,1fr);gap:.75rem;align-items:center}
.pm-lane-label>span{min-width:0}
.pm-capability{display:block;padding-left:.75rem;border-left:1px solid var(--rule-soft);font-size:.6875rem;font-weight:700;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-company{display:block;width:100%;text-align:left;font-size:.6875rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-company:hover{color:var(--navy);text-decoration:underline}
.pm-sector{display:block;font-size:.625rem;color:var(--muted);font-weight:500}
.pm-track::before{content:"";position:absolute;inset:.45rem 0;background:repeating-linear-gradient(to right,transparent 0,transparent calc((100% / var(--qcount)) - 1px),var(--rule-soft) calc((100% / var(--qcount)) - 1px),var(--rule-soft) calc(100% / var(--qcount)))}
.pm-track::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#e8edf3}
.pm-cell{display:flex;align-items:center;justify-content:center;gap:5px;min-width:0;z-index:1;flex-wrap:wrap;padding:.4rem .2rem}
.pm-mark{position:relative;width:11px;height:11px;border-radius:50%;background:var(--mk,var(--done));border:0;box-shadow:0 0 0 2px #fff;transition:transform .12s;flex-shrink:0}
.pm-mark.ai{--mk:var(--ai)}
.pm-mark.fin{--mk:var(--fin)}
.pm-mark:hover{transform:scale(1.45);z-index:3}
.pm-mark.claim{background:#fff;box-shadow:inset 0 0 0 2px var(--mk,var(--claim)),0 0 0 2px #fff}
.pm-mark.stop{background:var(--stop);box-shadow:0 0 0 2px #fff}
.pm-mark.stop::after{content:"×";position:absolute;inset:-3px 0 0;color:#fff;font-size:8px;font-weight:900;text-align:center}
.pm-more{font-size:.5625rem;color:var(--muted);white-space:nowrap}
/* 一個節點＝同能力 × 同季度 × 同場景的事件群。
   場景名稱直接寫在節點上，顏色只當輔助；狀態由前方實心／空心／叉號表達。 */
.pm-blk{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.3rem;min-width:0;width:auto;min-height:1.55rem;border-radius:999px;padding:.2rem .45rem;transition:transform .12s,opacity .15s;
  background:var(--st,#f8fafc);border:1px solid var(--sc);color:var(--sc);box-shadow:0 1px 2px rgba(15,23,42,.06);font-size:.625rem;font-weight:800;line-height:1;white-space:nowrap}
.pm-blk:hover{transform:translateY(-1px);z-index:3;box-shadow:0 3px 8px rgba(15,23,42,.14)}
.pm-blk-dot{position:relative;width:7px;height:7px;border-radius:50%;background:var(--sc);flex:0 0 auto}
.pm-blk.claim{background:#fff}
.pm-blk.claim .pm-blk-dot{background:#fff;box-shadow:inset 0 0 0 1.5px var(--sc)}
.pm-blk.stop{background:#fff7f7;border-color:#ef4444;color:#b91c1c}
.pm-blk.stop .pm-blk-dot{width:8px;height:8px;background:transparent}
.pm-blk.stop .pm-blk-dot::after{content:"×";position:absolute;inset:-2px 0 0;font-size:10px;font-weight:900;text-align:center}
.pm-blk-count{display:inline-flex;align-items:center;justify-content:center;min-width:1rem;height:1rem;padding:0 .25rem;border-radius:999px;background:rgba(255,255,255,.78);color:inherit;font-size:.5625rem;font-variant-numeric:tabular-nums}
.pm-blk.is-muted{opacity:.12;filter:saturate(.2)}
.pm-blk.is-muted:hover{opacity:.7;filter:none}
.pm-cap-name{display:block;width:100%;text-align:left;font-size:.6875rem;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-cap-name:hover{color:var(--navy);text-decoration:underline}
.pm-cap-meta{display:block;font-size:.625rem;color:var(--muted)}
.pm-state-key{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.625rem;font-size:.6875rem;color:var(--muted)}
.pm-state-key span{display:inline-flex;align-items:center;gap:.3125rem}
@media(max-width:720px){.pm-row{grid-template-columns:12rem minmax(40rem,1fr)}.pm-label-cols,.pm-lane-label{grid-template-columns:8rem minmax(0,1fr)}.pm-scene-toolbar{align-items:flex-start}.panorama-filter.is-compact .panorama-filter-group{align-items:flex-start;flex-direction:column}}
.sg-inner{min-width:48rem}
.sg-row{display:grid;grid-template-columns:11rem minmax(32rem,1fr);gap:.75rem;align-items:center;border-bottom:1px solid var(--rule-soft);min-height:3.1rem}
.sg-row:last-child{border-bottom:0}
.sg-head{min-height:2rem;border-bottom:1px solid var(--rule)}
.sg-label{font-size:.75rem;font-weight:700;color:var(--ink);min-width:0}
.sg-label small{display:block;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-track{display:grid;position:relative;align-items:center;height:100%;min-height:2.4rem}
.sg-track::before{content:"";position:absolute;inset:.25rem 0;background:repeating-linear-gradient(to right,transparent 0,transparent calc((100% / var(--qcount)) - 1px),var(--rule-soft) calc((100% / var(--qcount)) - 1px),var(--rule-soft) calc(100% / var(--qcount)))}
.sg-quarter{text-align:center;font-size:.625rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sg-cell{display:flex;justify-content:center;align-items:center;gap:2px;z-index:1;min-width:0}
.sg-mark{width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(15,23,42,.12);cursor:pointer;transition:transform .12s}
.sg-mark:hover{transform:scale(1.45)}
.sg-mark.ai{background:var(--ai)}
.sg-mark.fin{background:var(--fin)}
.sg-mark.claim{background:#fff;border-color:var(--claim);box-shadow:none}
.strategy-readout{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;margin-top:1rem}
.readout{background:var(--rule-soft);border-radius:.625rem;padding:.75rem}
.readout .rk{font-size:.625rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.readout .rv{font-size:.875rem;font-weight:700;margin-top:.25rem}
.readout .rs{font-size:.6875rem;color:var(--ink-2);margin-top:.125rem}
.mix-bar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--rule);margin-top:.625rem}
.mix-bar .ai{background:var(--ai)}
.mix-bar .fin{background:var(--fin)}
.mix-values{display:flex;justify-content:space-between;gap:.5rem;margin-top:.4375rem;font-size:.6875rem;color:var(--ink-2)}
.mix-values span{display:inline-flex;align-items:center;gap:.3125rem;white-space:nowrap}
.mix-values i{width:7px;height:7px;border-radius:50%;background:var(--mix);flex-shrink:0}
.mix-values b{color:var(--ink)}
/* 手機版：長條圖獨占一列，其餘三個縮成一排小方格 */
@media(max-width:820px){
  .strategy-readout{grid-template-columns:repeat(3,1fr)}

<script>
/* =========================================================================
   同業導入觀測 — 能力健康檢查表
   圓點列取代方塊網格：方塊等距排成格會被讀成座位表，圓點串在一條淡軸線上
   才會被讀成一條可掃視的軸。狀態三級，新聞退位成佐證。
   ========================================================================= */

const GROUPS = ['元大','國泰','富邦','中信','玉山','永豐','台新新光','凱基','兆豐','第一金','合庫','華南'];
const GROUP_SHORT = {'元大':'元大','國泰':'國泰','富邦':'富邦','中信':'中信','玉山':'玉山','永豐':'永豐','台新新光':'台新','凱基':'凱基','兆豐':'兆豐','第一金':'一銀','合庫':'合庫','華南':'華南'};
const ME = '元大';
const STALE_MONTHS = 12;
const GAP_PEERS = 8;

/* 導入家數分段：把「幾家在做」翻成一句主管看得懂的話 */
const BANDS = [
  { min:9, label:'已成標配',      hint:'9 家以上已導入，元大缺席等於落後' },
  { min:4, label:'半數在做',      hint:'4–8 家，正在成為主流' },
  { min:1, label:'少數在試',      hint:'1–3 家，做了就是差異化' },
  { min:0, label:'同業皆未見佐證', hint:'0 家' },
];

/* 場景封閉清單＝六大場景，與 references/schema.md、peer_sheet.py 的 SCENARIOS 一致。
   原本 24 個細場景已於 2026-08-04 收斂成這六個，CSV 的「場景」欄直接存這裡的 name。 */
const SCENE_CLUSTERS = [
  {id:'S1',color:'#55606e',tint:'#eff1f4',short:'內部治理',name:'內部效率與治理'},
  {id:'S2',color:'#2f6f66',tint:'#e9f3f1',short:'核心作業',name:'核心金融作業'},
  {id:'S3',color:'#6a5aa3',tint:'#f0edf8',short:'服務行銷',name:'智慧服務與行銷'},
  {id:'S4',color:'#a15750',tint:'#f8edec',short:'風險防詐',name:'風險防護與防詐'},
  {id:'S5',color:'#3a67b5',tint:'#eaf0fa',short:'通路支付',name:'數位通路與支付'},
  {id:'S6',color:'#8f7638',tint:'#f6f1e4',short:'投資財管',name:'投資財管與企業金融'},
];
SCENE_CLUSTERS.forEach(sg => sg.scenes = [sg.name]);   // 舊有的 sg.scenes.includes(x) 判斷照舊可用
const SCENE_OF_GROUP = Object.fromEntries(SCENE_CLUSTERS.map(sg => [sg.name, sg]));
const ALL_SCENES = SCENE_CLUSTERS.map(sg => sg.name);
const SCENE_GROUPS = SCENE_CLUSTERS;                   // 舊名保留，場景群組與場景已是同一層

/* 能力類型＝ taxonomy 的 13 個能力項（A1–A6／B1–B7），開頁時由 CSV 建出。 */
let CAP_CLUSTERS = [];

const RANK = { '已導入':3, '宣示中':2, '暫停':1 };
/* 形狀是主編碼（實心／空心環／✕），顏色只是輔助 */
const STATE = {
  3:{ cls:'d-done',  chip:'done',  glyph:'',  label:'已導入' },
  2:{ cls:'d-claim', chip:'claim', glyph:'',  label:'宣示中' },
  1:{ cls:'d-stop',  chip:'stop',  glyph:'✕', label:'暫停'   },
  0:{ cls:'d-none',  chip:'none',  glyph:'',  label:'未見佐證' },
};

let TAX = [], PROFILE = [], CAP = [];
let CAPS = [];
let CELL = new Map();        // 集團|能力項ID
let SCELL = new Map();       // 集團|場景
let CCELL = new Map();       // 集團|能力項ID|場景
let MONTHS = [];
let view = 'landscape', who = ME, capId = '', sceneId = '', side = 'all', showStale = false, whoSub = '__all__', whoCap = '__all__', whoScene = '__all__', crossAxis = 'scene', crossCap = '', crossScene = 'S4';
let dimensionView = 'scene', dimensionKind = 'scene', dimensionId = 'S2', dimensionGroup = ME;
let overviewSelection = 'triple';
let STALE_CUT = '';

/* ---------- utils ---------- */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const jsq = s => String(s == null ? '' : s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
const iso = v => {
  const m = String(v || '').trim().match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
  return m ? `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}` : '';
};
const datesOf = r => (r['歷次佐證日期'] || r['最近佐證日期'] || '')
  .split(';').map(x => iso(x)).filter(Boolean).sort();
const scenesOf = r => (r['場景'] || '').split('／').map(x => x.trim()).filter(Boolean);
const sceneClustersOf = r => SCENE_CLUSTERS.filter(sg=>scenesOf(r).some(s=>sg.scenes.includes(s)));
const capName = c => (TAX.find(t => t['能力項ID'] === c) || {})['能力項'] || c;
const capDef  = c => (TAX.find(t => t['能力項ID'] === c) || {})['定義'] || '';
const capSide = c => c[0] === 'A' ? 'AI' : '數金';
const cellOf  = (g, c) => CELL.get(g + '|' + c)  || { state:0, rows:[], first:'', last:'', stale:false };
const sceneCellOf = (g, s) => SCELL.get(g + '|' + s) || { state:0, rows:[], first:'', last:'', stale:false };
const comboCellOf = (g, c, s) => CCELL.get(g + '|' + c + '|' + s) || { state:0, rows:[], first:'', last:'', stale:false };

function parseCSV(text) {
  text = text.replace(/^﻿/, '').trim();
  const rows = [[]]; let f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i+1] === '"') { f += '"'; i++; } else q = false; }
      else f += c;
    }
    else if (c === '"') q = true;
    else if (c === ',') { rows[rows.length-1].push(f); f = ''; }
    else if (c === '\n') { rows[rows.length-1].push(f); f = ''; rows.push([]); }
    else if (c !== '\r') f += c;
  }
  rows[rows.length-1].push(f);
  const head = rows.shift().map(h => h.trim());
  return rows.filter(r => r.length > 1 && r.some(v => v.trim()))
             .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])));
}
const readCSV = k => {
  const el = document.getElementById('csv-' + k);
  return el ? parseCSV(el.textContent) : [];
};

/* 正式頁以 Google Sheet 發布 CSV 為主；內嵌 CSV 只作離線／連線失敗備援。
   每次載入附時間戳，避開 Google 發布端與瀏覽器留下的舊 CSV 快取。 */
const PEER_SHEET_PUB = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQbh-mBljvOVY586mRTKM_sduv2l2qXD-mZveOS6BvEFuKZuCc1zWwJI-eGKzg_fG7t4523aN8K7-MZ/pub';
const PEER_SHEET = {
  taxonomy: `${PEER_SHEET_PUB}?gid=1641856889&single=true&output=csv`,
  profile: `${PEER_SHEET_PUB}?gid=376379360&single=true&output=csv`,
  capability: `${PEER_SHEET_PUB}?gid=598329868&single=true&output=csv`,
};
async function loadCSV(k) {
  try {
    const sep = PEER_SHEET[k].includes('?') ? '&' : '?';
    const response = await fetch(`${PEER_SHEET[k]}${sep}_=${Date.now()}`, {cache:'no-store'});
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const rows = parseCSV(await response.text());
    if (!rows.length) throw new Error('雲端資料為空');
    return rows;
  } catch (err) {
    console.warn(`[peer] ${k} 雲端載入失敗，改用內嵌備援`, err);
    return readCSV(k);
  }
}

/* ---------- cells ---------- */
function addTo(map, k, r) {
  if (!map.has(k)) map.set(k, { state:0, rows:[], first:'', last:'' });
  const cell = map.get(k);
  cell.rows.push(r);
  cell.state = Math.max(cell.state, RANK[r['狀態']] || 0);
  const ds = datesOf(r);
  if (ds.length) {
    if (!cell.first || ds[0] < cell.first) cell.first = ds[0];
    if (ds[ds.length-1] > cell.last) cell.last = ds[ds.length-1];
  }
}
function finish(map) {
  map.forEach(cell => {
    // 暫停是明確的例外狀態，同格全是暫停時不該被聚合成「已導入」
    if (cell.rows.every(r => r['狀態'] === '暫停')) cell.state = 1;
    cell.stale = !!cell.last && cell.last < STALE_CUT;
  });
}
function buildCells() {
  CELL = new Map(); SCELL = new Map(); CCELL = new Map();
  CAP.forEach(r => {
    const g = r['集團'], c = r['能力項ID'];
    if (!GROUPS.includes(g)) return;
    if (CAPS.includes(c)) addTo(CELL, g + '|' + c, r);
    scenesOf(r).forEach(s => {
      if (!SCENE_OF_GROUP[s]) return;
      addTo(SCELL, g + '|' + s, r);
      addTo(CCELL, g + '|' + c + '|' + s, r);
    });
  });
  finish(CELL); finish(SCELL); finish(CCELL);
  MONTHS = [...new Set(CAP.flatMap(r => datesOf(r)).map(d => d.slice(0,7)))].sort();
}

const covered = (g, c) => cellOf(g, c).state > 0;
const adopted = (g, c) => cellOf(g, c).state === 3;
const groupCov = g => CAPS.filter(c => covered(g, c)).length;
const doneCount  = c => GROUPS.filter(g => adopted(g, c)).length;
const sceneDone  = s => GROUPS.filter(g => sceneCellOf(g, s).state === 3).length;
const peersOn = c => GROUPS.filter(g => g !== ME && adopted(g, c)).length;
const bandOf = n => BANDS.find(b => n >= b.min);

/* ---------- tooltip ---------- */
const tipEl = () => document.getElementById('tip');
function showTip(ev, html) {
  const t = tipEl();
  t.innerHTML = html; t.classList.add('on');
  const r = t.getBoundingClientRect();
  let x = ev.clientX + 14, y = ev.clientY + 16;
  if (x + r.width  > innerWidth  - 8) x = ev.clientX - r.width  - 14;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 14;
  t.style.left = Math.max(8, x) + 'px';
  t.style.top  = Math.max(8, y) + 'px';
}
const hideTip = () => tipEl().classList.remove('on');

function dotTip(g, label, cell, extra) {
  const st = STATE[cell.state];
  const L = [`<b>${esc(g)}　${esc(label)}</b>`,
             `<span class="t-sub">${st.label}${cell.rows.length ? `・${cell.rows.length} 件佐證` : ''}</span>`];
  if (cell.first) L.push(`<span class="t-sub">最早 ${cell.first}　最近 ${cell.last}</span>`);
  if (cell.stale) L.push(`<span class="t-sub">⚠ 逾 ${STALE_MONTHS} 個月未更新</span>`);
  if (extra) L.push(`<span class="t-sub">${extra}</span>`);
  const d = cell.rows[0] && cell.rows[0]['說明'];
  if (d) L.push(`<span class="t-sub">${esc(d).slice(0,90)}…</span>`);
  return L.join('<br>');
}
const capTip   = (g, c) => dotTip(g, capName(c), cellOf(g, c),
  cellOf(g,c).state === 0 && g === ME && peersOn(c) >= GAP_PEERS ? `⚠ 同業已有 ${peersOn(c)} 家導入` : '');
const sceneTip = (g, s) => dotTip(g, s, sceneCellOf(g, s), '');

/* =========================================================================
   共用元件：圓點列
   ========================================================================= */
function dotHead(firstColLabel) {
  return `<div class="dot-row dot-head">
    <div class="dot-count-head" style="text-align:left">${firstColLabel}</div>
    <div class="dot-track">${GROUPS.map(g =>
      `<div class="dot-col-label ${g === ME ? 'is-me' : ''}" onclick="showOne('${g}')"
            title="進入 ${g} 單家詳頁">${g}</div>`).join('')}</div>
    <div class="dot-count-head">導入家數</div>
  </div>`;
}

/* rows: [{ id, name, sub, cells:[cell x12], n, onLabel, tipFn }] */
function dotRows(rows, bandFn) {
  let lastBand = null, h = '';
  rows.forEach(row => {
    const b = bandFn ? bandFn(row) : null;
    if (b && b.label !== lastBand) {
      lastBand = b.label;
      h += `<div class="band"><span class="band-bar" style="background:${b.color || 'var(--done)'}"></span>
            <span class="band-label">${esc(b.label)}</span><span class="band-hint">${esc(b.hint || '')}</span></div>`;
    }
    h += `<div class="dot-row">
      <div class="row-label">
        <button onclick="${row.onLabel}" title="${esc(row.title || '')}">
          ${row.id ? `<span class="id">${row.id}</span>` : ''}${row.sub ? `<span class="scene-path">${esc(row.sub)}</span>` : ''}<span class="nm">${esc(row.name)}</span>
        </button>
      </div>
      <div class="dot-track axis">${GROUPS.map((g, i) => {
        const cell = row.cells[i], st = STATE[cell.state];
        const stale = cell.stale && showStale ? ' stale' : '';
        return `<div class="dot-cell"><span class="dot ${st.cls}${stale}" role="button" tabindex="0"
          aria-label="${esc(`${g} ${row.name}：${st.label}`)}"
          onmouseenter="showTip(event, ${row.tipFn}('${g}'))" onmousemove="showTip(event, ${row.tipFn}('${g}'))"
          onmouseleave="hideTip()" onclick="${row.onDot}('${g}')">${st.glyph}</span></div>`;
      }).join('')}</div>
      <div class="dot-count"><b style="color:${row.n ? 'var(--done)' : 'var(--muted)'}">${row.n}</b><span>/12</span></div>
    </div>`;
  });
  return h;
}

const LEGEND = `<div class="legend">
  <span class="li"><i class="swatch done"></i>已導入</span>
  <span class="li"><i class="swatch claim"></i>宣示中（空心）</span>
  <span class="li"><i class="swatch stop">✕</i>暫停</span>
  <span class="li"><i class="swatch none"></i>未見佐證</span>
</div>`;

const NOTES = `<div class="notes">
  <p><i class="swatch done"></i><b>實心綠＝已導入</b>：有公開佐證顯示已實際上線運作。</p>
  <p><i class="swatch claim"></i><b>空心橘＝宣示中</b>：已對外宣布、簽了合作或發了新聞稿，但<b>尚未見到實際上線的佐證</b>。
     空心與實心要分開看，才分得出「說的」和「做的」——例如「自建／共建金融語言模型」整列多是空心，

  <p><i class="swatch stop">✕</i><b>紅底 ✕＝暫停</b>：曾經導入，但服務已下架或專案中止。</p>

  <p class="footnote">「導入家數」只計實心綠點，單位是「家」不是「條」：同一家發 10 則新聞或 1 則都只算 1 家，發稿密度不影響排序。</p>
</div>`;

function aggregateRows(rows) {
  if (!rows.length) return {state:0,rows:[],first:'',last:'',stale:false};
  const cell={state:0,rows:[],first:'',last:''}, map=new Map([['x',cell]]);
  rows.forEach(r=>addTo(map,'x',r));
  if (cell.rows.every(r=>r['狀態']==='暫停')) cell.state=1;
  cell.stale=!!cell.last && cell.last<STALE_CUT;
  return cell;
}

/* 將底層佐證聚合為一個「集團 × 場景 × 能力項」交叉格。 */
function crossCell(g, cg, sg) {
  const rows = CAP.filter(r => r['集團']===g && capabilityClusterMatch(r,cg) && scenesOf(r).some(s=>sg.scenes.includes(s)));
  return aggregateRows(rows);
}

const capabilityClusterMatch = (r, def) => def.caps.includes(r['能力項ID']);
const capabilityTypesOf = r => CAP_CLUSTERS.filter(cg=>capabilityClusterMatch(r,cg));

/* 場景欄只收「有標到該場景」的佐證，未標場景與標在別的場景的佐證會整條消失，
   於是同一列會出現「矩陣看起來 0 家、點進去卻 10 家」。這裡把落在別處的佐證撿回來當第五種標記。 */
function elsewhereOf(g, cg, sg) {
  const rows=CAP.filter(r=>r['集團']===g && capabilityClusterMatch(r,cg) && !scenesOf(r).some(x=>sg.scenes.includes(x)));
  const where=[...new Set(rows.flatMap(r=>{
    const ss=scenesOf(r);
    return ss.length ? ss.map(x=>(SCENE_CLUSTERS.find(c=>c.scenes.includes(x))||{}).name||x) : ['未標場景'];
  }))];
  return {n:rows.length, where};
}

function dimensionCell(g, kind, def) {
  const rows=CAP.filter(r=>r['集團']===g && (kind==='scene'
    ? scenesOf(r).some(s=>def.scenes.includes(s))
    : capabilityClusterMatch(r,def)));
  return aggregateRows(rows);
}

function renderLandscape() {
  const selectedCap=CAP_CLUSTERS.find(x=>x.id===crossCap)||CAP_CLUSTERS[0];
  const selectedScene=SCENE_CLUSTERS.find(x=>x.id===crossScene)||SCENE_CLUSTERS[0];
  const sceneStats=SCENE_CLUSTERS.map(sg=>{
    const activeGroups=GROUPS.filter(g=>CAP_CLUSTERS.some(cg=>crossCell(g,cg,sg).state===3)).length;
    const evidence=GROUPS.reduce((n,g)=>n+CAP_CLUSTERS.filter(cg=>crossCell(g,cg,sg).state>0).length,0);
    return {sg,activeGroups,evidence};

  const activeGroups=GROUPS.filter(g=>CAP_CLUSTERS.some(cg=>crossCell(g,cg,selectedScene).state===3)).length;
  const sceneNav=sceneStats.map(({sg,activeGroups,evidence})=>`<button class="focus-scene ${crossScene===sg.id?'on':''}" onclick="focusSceneCluster('${sg.id}')" aria-pressed="${crossScene===sg.id}">

      ${cells.map(({g,cell})=>{const st=STATE[cell.state],on=overviewSelection==='triple'&&g===dimensionGroup&&cg.id===crossCap&&selectedScene.id===crossScene;
        const el=cell.state===0?elsewhereOf(g,cg,selectedScene):{n:0,where:[]};

        return `<td class="${g===ME?'me':''}"><button class="tri-dot ${st.chip} ${on?'on':''}" onclick="pickTriple('${g}','${cg.id}','${selectedScene.id}')" aria-label="${esc(label)}" title="${esc(label)}"></button></td>`;
      }).join('')}<td class="focus-total"><b>${done}</b>/12</td></tr>`;
  };
  // A 段與 B 段各自帶一條分段標題，取代原本的「能力類型」表頭
  const matrixRows=['AI','數金'].map(sd=>{
    const caps=CAP_CLUSTERS.filter(cg=>cg.side===sd);

    return `<tr class="focus-side ${sd==='AI'?'ai':'fin'}"><th class="focus-cap focus-side-label">${sd} 面</th>
      <td colspan="${GROUPS.length}"><span class="focus-side-note">${caps.map(c=>c.id).join('・')}</span></td>
      <td class="focus-total"><b>${done}</b>/12</td></tr>${caps.map(capRow).join('')}`;
  }).join('');
  return `<div class="card card-pad">
    <div class="map-intro"><div><div class="sec-title">六大場景總覽</div>
      <h2 style="font-size:1.125rem;color:var(--navy)">選一個場景，橫向比較 12 家集團 × 13 個能力項</h2>
      <p class="footnote" style="margin-top:.375rem;max-width:54rem">能力改為逐列顯示完整名稱；沿著同一列橫向掃描，即可比較各集團在該能力的導入差異。採全集團聚合口徑。</p></div></div>
    <div class="focus-scenes">${sceneNav}</div>
    <section class="focus-board">
      <div class="focus-board-head"><div><div class="focus-board-title">${esc(selectedScene.name)}</div><p class="focus-board-sub">六大場景分類</p></div><span class="chip done">${activeGroups}/12 家已導入</span></div>
      <div class="focus-table-wrap thin"><table class="focus-table"><thead><tr><th class="focus-cap-head"></th>${GROUPS.map(g=>`<th><button class="focus-company ${g===ME?'me':''}" onclick="showOne('${g}')" title="進入 ${g} 單家詳頁">${g===ME?'★ ':''}${esc(g)}</button></th>`).join('')}<th class="focus-total">導入家數</th></tr></thead><tbody>${matrixRows}</tbody></table></div>
    </section>
    <div class="tri-state-note"><span><i class="tri-dot done" style="--cap-color:var(--done)"></i>已導入</span><span><i class="tri-dot claim" style="--cap-color:var(--claim)"></i>宣示中</span><span><i class="tri-dot stop"></i>暫停</span><span><i class="tri-dot"></i>未見佐證</span></div>

function renderMatrix() {

/* =========================================================================
   VIEW 2／3：場景分析 與 能力項詳頁
   兩者同一個形狀：篩選 → 誰在做誰先做（每家一條逐季長條）→ 逐季歷程。
   場景回答「用在哪」，能力項回答「做了什麼」。
   ========================================================================= */

const qOf = d => `${d.slice(0,4)}Q${Math.floor((+d.slice(5,7) - 1) / 3) + 1}`;
const qFull = q => `${q.slice(0,4)} ${q.slice(4)}`;

/* 從資料算出連續的季別軸（中間沒有佐證的季也要留欄，不然長條會被壓縮失真） */
function quarterList() {
  const qs = [...new Set(MONTHS.map(m => qOf(m + '-01')))].sort();
  if (!qs.length) return [];
  let [y, q] = qs[0].split('Q').map(Number);
  const [ey, eq] = qs[qs.length-1].split('Q').map(Number);
  const out = [];
  while (y < ey || (y === ey && q <= eq)) {
    out.push(`${y}Q${q}`);
    if (++q > 4) { q = 1; y++; }
  }
  return out;
}

/* 一格＝一季。該季有 已導入 佐證→深色，只有宣示中→淺色，沒有→灰底 */
function qStrip(rows, qs, onClick) {
  return `<span class="qstrip">${qs.map(q => {
    const hit = rows.filter(r => datesOf(r).some(d => qOf(d) === q));
    if (!hit.length) return `<span class="qcell" title="${qFull(q)}：無"></span>`;
    const done = hit.some(r => r['狀態'] === '已導入');
    const t = `${qFull(q)}：${hit.length} 條・${[...new Set(hit.map(r => r['狀態']))].join('／')}`;
    return `<span class="qcell ${done ? 'done' : 'claim'}" title="${esc(t)}"
      ${onClick ? `onclick="${onClick}"` : ''}></span>`;
  }).join('')}</span>`;
}

/* 逐季歷程：把每一個佐證日期都落成一則，最新的季在最上面。
   同一則新聞常同時命中多個能力項（skill 的雙記規則），在場景視圖裡會變成同一條重複三次；
   這裡依「集團＋子公司＋URL＋日期」併成一則，把能力項合併成多個標籤。 */
function mergeItems(items) {
  const m = new Map();
  items.forEach(x => {
    const k = [x.g, x.r['子公司'], x.r['佐證URL'] || x.r['佐證標題'], x.d].join('|');
    if (!m.has(k)) m.set(k, { ...x, caps:[], capTypes:[], descs:[], scenes:[], sceneTypes:[], statuses:[] });
    const e = m.get(k);
    const c = x.r['能力項ID'];
    if (c && !e.caps.includes(c)) e.caps.push(c);
    capabilityTypesOf(x.r).forEach(cg=>{if(!e.capTypes.some(x=>x.id===cg.id))e.capTypes.push(cg);});
    const d = (x.r['說明'] || '').trim();
    if (d && !e.descs.includes(d)) e.descs.push(d);
    scenesOf(x.r).forEach(s => { if (!e.scenes.includes(s)) e.scenes.push(s); });
    sceneClustersOf(x.r).forEach(sg=>{if(!e.sceneTypes.some(x=>x.id===sg.id))e.sceneTypes.push(sg);});
    if (!e.statuses.includes(x.r['狀態'])) e.statuses.push(x.r['狀態']);
  });
  return [...m.values()].map(e => {
    // 各能力項的說明常互相包含（B7 那句蓋掉 B2＋B5），被包含的就不重複印
    e.desc = e.descs.filter(d => !e.descs.some(o => o !== d && o.includes(d))).join('；');
    e.status = e.statuses.includes('已導入') ? '已導入'
             : e.statuses.includes('宣示中') ? '宣示中' : e.statuses[0];
    return e;
  });
}

function quarterLog(items, qs) {
  const merged = mergeItems(items);
  const byQ = new Map(qs.map(q => [q, []]));
  merged.forEach(x => { if (byQ.has(x.q)) byQ.get(x.q).push(x); });
  const secs = qs.slice().reverse().map(q => {
    const list = byQ.get(q).sort((a,b) => b.d.localeCompare(a.d));
    if (!list.length) return '';
    return `<div class="qseg">
      <div class="qseg-head">
        <span class="qseg-title">${qFull(q)}</span>
        <span class="qseg-n">${list.length} 則</span>
      </div>
      ${list.map(e => `
        <div class="qitem">
          <span class="qitem-dot ${e.status === '已導入' ? 'done' : e.status === '暫停' ? 'stop' : 'claim'}"></span>
          <div class="qitem-body">
            <div class="qitem-top">
              <button class="qitem-g ${e.g === ME ? 'me' : ''}" onclick="showOne('${e.g}')">${e.g}</button>
              <span class="tag">${esc(e.r['子公司'])}</span>
              <span class="chip ${STATE[RANK[e.status]||0].chip}">${esc(e.status)}</span>
              ${e.latest ? '' : '<span class="chip none">先前的推進</span>'}
              <span class="qitem-d">${e.d}</span>
            </div>
            <p class="qitem-desc">${esc(e.desc)}</p>
            <div class="qitem-tags">
              ${e.capTypes.map(cg => `<span class="chip ai">${esc(cg.name)}</span>`).join('')}
              ${e.sceneTypes.map(sg => `<span class="tag">${esc(sg.name)}</span>`).join('')}
              ${e.r['佐證URL'] ? `<a class="linkout" href="${esc(e.r['佐證URL'])}" target="_blank" rel="noopener">開新聞 ↗</a>` : ''}
            </div>
          </div>
        </div>`).join('')}
    </div>`;
  }).join('');
  return secs || '<p class="empty">尚無佐證</p>';
}

/* 兩個詳頁共用：篩選 → 誰在做誰先做 → 逐季歷程 */
function detailView({ picker, eyebrow, title, def, cellFor, openFor, footer, focusGroup='' }) {
  const qs = quarterList();
  const stats = GROUPS.map(g => ({ g, cell: cellFor(g) }));
  const doing = stats.filter(x => x.cell.state > 0)
    .sort((a,b) => b.cell.state - a.cell.state || a.cell.first.localeCompare(b.cell.first));
  const idle  = stats.filter(x => !x.cell.state);
  const done  = stats.filter(x => x.cell.state === 3).length;
  const claim = stats.filter(x => x.cell.state === 2).length;
  const total = stats.reduce((n,x) => n + x.cell.rows.length, 0);

  const ladder = doing.map((x, i) => {
    const st = STATE[x.cell.state];
    return `<div class="lad ${x.g===focusGroup?'focus':''}">
      <span class="lad-i">${i + 1}</span>
      <button class="lad-g ${x.g === ME ? 'me' : ''}" onclick="showOne('${x.g}')">${x.g}${x.g === ME ? ' ★' : ''}</button>
      <span class="lad-s"><span class="chip ${st.chip}">${st.glyph} ${st.label}</span></span>
      <span class="lad-m">${x.cell.first} 起・${x.cell.rows.length} 條</span>
      ${qStrip(x.cell.rows, qs, `${openFor}('${x.g}')`)}
      <button class="lad-more" onclick="${openFor}('${x.g}')" title="看佐證">明細 →</button>
    </div>`;
  }).join('');

  /* 逐季歷程的素材：每個佐證的每個日期都落一則 */
  const items = [];
  GROUPS.forEach(g => cellFor(g).rows.forEach(r => {
    const ds = datesOf(r), last = ds[ds.length-1];
    ds.forEach(d => items.push({ r, d, g, q: qOf(d), latest: d === last }));
  }));

  return `
    ${picker}
    <div class="card card-pad" style="margin-top:1rem">
      <div class="grouphead">
        <div style="flex:1;min-width:16rem">

/* =========================================================================
   時間線：一欄一季，一點一次佐證；季度直接標示，時間軸才可被讀懂。
   ========================================================================= */
let TL = {};
function timeline(rows, key) {
  TL[key] = rows;
  const dated = rows.flatMap(r => datesOf(r).map(d => ({ r, d })));
  if (!dated.length) return '<p class="empty">尚無可排序的佐證日期</p>';
  const quarters = quarterList();
  const by = new Map(quarters.map(q => [q, []]));
  dated.forEach(x => { const q = qOf(x.d); if (by.has(q)) by.get(q).push(x); });
  const maxStack = Math.max(3, ...[...by.values()].map(v => v.length));
  const H = maxStack * 11 + 6;

  const cols = quarters.map(q => {
    const rs = by.get(q).sort((a,b) => a.d.localeCompare(b.d));
    const dots = rs.map(({ r, d }) => {
      const isAI = (r['能力項ID'] || '')[0] === 'A';
      const latest = d === iso(r['最近佐證日期']);
      return `<span class="tl-dot" style="background:${isAI ? 'var(--ai)' : 'var(--fin)'};opacity:${latest ? 1 : .4}"
        title="${esc(`${d}｜${r['子公司']}｜${capName(r['能力項ID'])}（${r['狀態']}）${latest ? '' : '・先前的推進紀錄'}`)}"></span>`;
    }).join('');
    return `<div class="tl-col ${rs.length ? 'hit' : ''}" style="height:${H}px"
      ${rs.length ? `onclick="showQuarter('${q}','${key}',this)"` : ''}>${dots}</div>`;
  }).join('');

  const ticks = quarters.map(q => `<div>${q}</div>`).join('');

  return `<div class="tl">${cols}</div><div class="tl-ticks">${ticks}</div>
    <p class="footnote" style="margin-top:.375rem">
      一點＝一次佐證（同一件事的歷次推進都會落點，較淡的是先前紀錄）；
      <span style="color:var(--ai)">●</span> AI 面　<span style="color:var(--fin)">●</span> 數金面。
      點季度看該季佐證。橫跨 ${quarters[0]} ～ ${quarters[quarters.length-1]}。</p>
    <div id="tld-${key}" class="hidden" style="margin-top:.75rem"></div>`;
}

function showQuarter(q, key, el) {
  el.parentElement.querySelectorAll('.tl-col.on').forEach(x => x.classList.remove('on'));
  el.classList.add('on');
  const items = (TL[key] || []).filter(r => datesOf(r).some(d => qOf(d) === q));
  const box = document.getElementById('tld-' + key);
  box.classList.remove('hidden');
  box.innerHTML = `<div style="border:1px solid var(--rule);border-radius:.5rem;background:var(--rule-soft);padding:.875rem">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.5rem">
      <span class="h3">${q}｜${items.length} 條佐證</span>
      <button onclick="document.getElementById('tld-${key}').classList.add('hidden')"
              style="color:var(--muted)">✕</button>
    </div>
    ${items.sort((a,b)=>(iso(b['最近佐證日期'])||'').localeCompare(iso(a['最近佐證日期'])||'')).map(evidence).join('')}
  </div>`;
}

/* =========================================================================
   VIEW 4：單家詳頁 — 集團 × 子公司 × 時間
   ========================================================================= */
function subBuckets(g) {
  const p = PROFILE.find(x => x['集團'] === g) || {};
  const parse = s => (s || '').split(/[／、,\/]/).map(x => x.trim()).filter(Boolean);
  const mainEnt = parse(p['主事業體']), otherEnt = parse(p['其他事業體']);
  const SECTORS = ['銀行','證券','人壽','產險','投信','期貨','投顧'];

  const buckets = new Map();
  CAP.filter(r => r['集團'] === g).forEach(r => {
    const isGroup = r['業別'] === '金控';
    const k = isGroup ? '__group__' : r['子公司'];
    if (!buckets.has(k)) buckets.set(k, {
      key:k, name: isGroup ? '集團層（跨子公司）' : r['子公司'],
      sector: isGroup ? '' : r['業別'], isGroup, isMain:false, rows:[],
    });
    buckets.get(k).rows.push(r);
  });

  // profile 與佐證的子公司命名偶有出入（例：合庫銀行 vs 合作金庫銀行）。
  // 名稱對不上時，只在「該業別只有一家」時才視為同一家，不做其他猜測。
  const list = [...buckets.values()].filter(b => !b.isGroup);
  const bind = (names, base) => names.forEach((name, i) => {
    let b = list.find(x => x.name === name && x.rank === undefined);
    if (!b) {
      const sec = SECTORS.find(s => name.endsWith(s));
      const cand = list.filter(x => x.sector === sec && x.rank === undefined);
      if (sec && cand.length === 1) b = cand[0];
    }
    if (b) { b.rank = base + i; b.isMain = base === 100; }
  });
  bind(mainEnt, 100); bind(otherEnt, 200);
  list.forEach(b => {
    if (b.rank === undefined) {
      const s = SECTORS.indexOf(b.sector);
      b.rank = 300 + (s < 0 ? SECTORS.length : s);
    }
  });
  return [...buckets.values()].sort((a,b) => (a.isGroup ? 0 : a.rank) - (b.isGroup ? 0 : b.rank));
}

function quarterRangeFromDates(ds) {
  const qs = ds.filter(Boolean).map(qOf).sort();
  if (!qs.length) return [];
  let [y,q] = qs[0].split('Q').map(Number);
  const [ey,eq] = qs[qs.length-1].split('Q').map(Number), out = [];
  while (y < ey || (y === ey && q <= eq)) {
    out.push(`${y}Q${q}`);
    if (++q > 4) { q = 1; y++; }
  }
  return out;
}

function topCount(values) {
  const m = new Map();
  values.filter(Boolean).forEach(v => m.set(v,(m.get(v)||0)+1));
  return [...m.entries()].sort((a,b)=>b[1]-a[1])[0] || ['—',0];
}

/* 單家策略圖：同一張圖同時承載時間、子公司、AI／數金；點位再帶能力與場景。 */
function strategyMap(g, buckets, rows) {
  const allDates = rows.flatMap(datesOf);
  const qs = quarterRangeFromDates(allDates);
  if (!qs.length) return '<p class="empty">尚無可繪製的季度資料。</p>';
  const lanes = buckets.filter(b => b.rows.length);
  const columns = `repeat(${qs.length},minmax(3.75rem,1fr))`;
  const laneHtml = lanes.map(b => `<div class="sg-row">
    <button class="sg-label" onclick="pickSub('${jsq(b.key)}')">${b.isMain?'★ ':''}${esc(b.name)}<small>${esc(b.sector || '跨子公司')}</small></button>
    <div class="sg-track" style="grid-template-columns:${columns};--qcount:${qs.length}">${qs.map(q => {
      const hits = b.rows.filter(r => datesOf(r).some(d => qOf(d) === q));
      return `<div class="sg-cell">${hits.slice(0,4).map(r => {
        const isAI = capSide(r['能力項ID']) === 'AI', claim = r['狀態'] === '宣示中';
        const title = `${q}｜${r['子公司']}｜${capName(r['能力項ID'])}｜${scenesOf(r).join('、') || '未分類場景'}｜${r['狀態']}`;
        return `<button class="sg-mark ${isAI?'ai':'fin'} ${claim?'claim':''}" title="${esc(title)}" onclick="openCell('${g}','${r['能力項ID']}')"></button>`;
      }).join('')}${hits.length>4?`<span style="font-size:.625rem;color:var(--muted)">+${hits.length-4}</span>`:''}</div>`;
    }).join('')}</div>
  </div>`).join('');
  return `<div class="strategy-grid thin"><div class="sg-inner">
    <div class="sg-row sg-head"><span class="sg-label">事業體</span><div class="sg-track" style="grid-template-columns:${columns};--qcount:${qs.length}">${qs.map(q=>`<span class="sg-quarter">${q}</span>`).join('')}</div></div>
    ${laneHtml}
  </div></div>
  <div class="legend" style="margin-top:.75rem"><span class="li"><i class="swatch" style="background:var(--ai)"></i>AI</span><span class="li"><i class="swatch" style="background:var(--fin)"></i>數金</span><span class="li"><i class="swatch claim"></i>宣示中</span></div>`;
}

/* 一張圖三個維度：縱軸＝能力類型、橫軸＝季度、節點文字＝場景。
   同能力 × 同季 × 同場景合併成一個事件節點，降低逐筆色塊造成的噪音。 */
const sceneClusterOf = r => SCENE_CLUSTERS.find(sg=>scenesOf(r).some(x=>sg.scenes.includes(x)));
function strategyPanoramaMap(g, buckets, rows, axisRows=rows, capFilter='__all__') {
  const qs=quarterRangeFromDates(axisRows.flatMap(datesOf));
  if (!qs.length) return '<p class="empty">尚無可繪製的季度資料。</p>';
  const columns=`repeat(${qs.length},minmax(3.25rem,1fr))`;
  const live=CAP_CLUSTERS.filter(cg=>rows.some(r=>capabilityClusterMatch(r,cg)));
  if (!live.length) return '<p class="empty">此篩選條件下沒有佐證。</p>';
  const capRow=cg=>{
    const capRows=rows.filter(r=>capabilityClusterMatch(r,cg));
    return `<div class="pm-row pm-lane"><div class="pm-label">
      <button class="pm-cap-name" onclick="openCell('${g}','${cg.id}')" title="查看 ${esc(cg.name)} 的全部佐證">${esc(cg.name)}</button>
      <span class="pm-cap-meta">${capRows.length} 則佐證・${new Set(capRows.flatMap(r=>sceneClustersOf(r).map(sg=>sg.id))).size} 個場景</span></div>
      <div class="pm-track" style="grid-template-columns:${columns};--qcount:${qs.length}">${qs.map(q=>{
        const quarterRows=capRows.filter(r=>datesOf(r).some(d=>qOf(d)===q));
        const groups=SCENE_CLUSTERS.map(sg=>({sg,rs:quarterRows.filter(r=>scenesOf(r).some(s=>sg.scenes.includes(s)))})).filter(x=>x.rs.length);
        return `<div class="pm-cell">${groups.map(({sg,rs})=>{
          const rank=Math.max(...rs.map(r=>RANK[r['狀態']]||0));
          const status=rank===2?'claim':rank===1?'stop':'done';
          const companies=[...new Set(rs.map(r=>r['子公司']).filter(Boolean))];
          const title=`${q}｜${cg.name}｜${sg.name}｜${rs.length} 則｜${companies.join('、')}`;
          const indices=[...new Set(rs.map(r=>CAP.indexOf(r)))].join(',');
          return `<button class="pm-blk ${status} ${whoScene!=='__all__'&&whoScene!==sg.id?'is-muted':''}" style="--sc:${sg.color};--st:${sg.tint}" title="${esc(title)}" aria-label="${esc(title)}" onclick="openStrategyCluster('${indices}','${cg.id}','${sg.id}','${q}')"><i class="pm-blk-dot" aria-hidden="true"></i><span>${esc(sg.short)}</span>${rs.length>1?`<b class="pm-blk-count">${rs.length}</b>`:''}</button>`;
        }).join('')}</div>`;
      }).join('')}</div></div>`;
  };
  const bands=['AI','數金'].map(sd=>{
    const caps=live.filter(cg=>cg.side===sd);
    if (!caps.length) return '';
    return `<div class="pm-row pm-scene"><div class="pm-label"><span class="pm-scene-name">${sd} 面</span></div>
      <div class="pm-scene-track"><span class="pm-scene-summary">${caps.length} 個能力項有佐證</span></div></div>${caps.map(capRow).join('')}`;
  }).join('');
  const idle=CAP_CLUSTERS.filter(cg=>!live.includes(cg));
  const sceneToolbar=`<div class="pm-scene-toolbar"><span class="pm-scene-toolbar-label">聚焦場景</span>
    <button class="pm-scene-filter ${whoScene==='__all__'?'on':''}" onclick="pickWhoScene('__all__')" title="目前篩選範圍共 ${rows.length} 則佐證">全部<span class="pm-scene-count">${rows.length}</span></button>
    ${SCENE_CLUSTERS.map(sg=>{const n=rows.filter(r=>scenesOf(r).some(s=>sg.scenes.includes(s))).length;return `<button class="pm-scene-filter ${whoScene===sg.id?'on':''}" style="--sc:${sg.color};--tint:${sg.tint}" onclick="pickWhoScene('${sg.id}')" title="${esc(sg.name)}：${n} 則佐證"><i></i>${esc(sg.name)}<span class="pm-scene-count">${n}</span></button>`}).join('')}</div>`;
  return `${sceneToolbar}<div class="pm-chart thin"><div class="pm-inner">
      <div class="pm-row pm-axis"><div class="pm-axis-label">能力類型</div><div class="pm-axis-track" style="grid-template-columns:${columns}">${qs.map((q,i)=>`<span class="pm-quarter ${i===0||q.endsWith('Q1')?'is-year-start':''} ${i===qs.length-1?'is-latest':''}">${q}</span>`).join('')}</div></div>
      ${bands}
    </div></div>
    <div class="pm-state-key"><span><i class="pm-blk-dot" style="--sc:var(--ink-2)"></i>實心＝已導入</span><span><i class="pm-blk claim" style="--sc:var(--ink-2);padding:.25rem"><i class="pm-blk-dot"></i></i>空心＝宣示中</span><span><i class="pm-blk stop" style="padding:.25rem"><i class="pm-blk-dot"></i></i>×＝暫停</span><span>標籤＝落地場景</span><span>數字＝同季同場景佐證數</span><span>點標籤看佐證</span></div>
    ${idle.length?`<p class="footnote" style="margin-top:.5rem">未見佐證：${idle.map(cg=>esc(cg.id)).join('・')}</p>`:''}`;
}

function groupFingerprint(g) {
  return `<div class="fingerprint"><table class="panel-grid"><thead><tr><th class="pg-company">場景 \ 能力</th>${CAP_CLUSTERS.map(cg=>`<th class="pg-cap" title="${esc(cg.name)}">${esc(cg.id)}</th>`).join('')}</tr></thead><tbody>
