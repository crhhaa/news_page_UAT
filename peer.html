<!DOCTYPE html>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        html { scroll-behavior: smooth; }
        .cell { cursor: pointer; transition: transform .08s; }
        .cell:hover { transform: scale(1.06); }
        /* 捲動容器本身不留左右 padding：有 padding 的話格子會捲進 padding 區、露在 sticky 首欄旁邊 */
        .matrix-wrap { overflow-x: auto; padding-left: 0; padding-right: 0; }
        .matrix { margin-inline: auto; }   /* 窄於容器時置中；寬於容器時 margin 自動歸零，橫捲與 sticky 不受影響 */
        .matrix th.sticky-col, .matrix td.sticky-col {
            position: sticky; left: 0; background: #fff; z-index: 3;
        }
        /* border-spacing 的縫隙是透明的，補一道白色遮罩擋住捲過來的格子 */
        .matrix th.sticky-col::after, .matrix td.sticky-col::after {
            content: ''; position: absolute; top: -4px; bottom: -4px; right: 100%; width: 40px;
            background: #fff;
        }
        .stale { opacity: .45; }
        /* 點擊區是整欄（手機上單顆點太小點不到），點本身只是視覺 */
        .tl-col { cursor: pointer; border-radius: 3px; }
        .tl-col:hover, .tl-col.on { background: #f1f5f9; }
        /* 左側時間軸已有一條線，卡片自己的灰色左框就收掉（宣示中的琥珀色保留當狀態提示） */
        .tl-rail .border-slate-300 { border-color: transparent; }
        /* 能力項名稱可點擊：看橫向比較 */
        .cap-label { cursor: pointer; border-radius: 4px; padding: 1px 4px; margin: -1px -4px; transition: background .12s, color .12s; }
        .cap-label:hover { background: #eff6ff; color: #1e40af; }
        .cap-label.active { background: #dbeafe; color: #1e40af; }
        /* 雷達圖上的能力標籤可點擊 */
        .radar-cap-label { cursor: pointer; transition: opacity .15s; }
        .radar-cap-label:hover { opacity: .65; }
        /* 子公司 sub-tab */
        .sub-tab { cursor: pointer; transition: all .15s; border: 1px solid #d1d5db; }
        .sub-tab:hover { background: #eff6ff; border-color: #93c5fd; }
        .sub-tab.active { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
        /* 集團名可點擊：跳單家詳頁 */
        .group-label { cursor: pointer; transition: color .12s; }
        .group-label:hover { color: #1e40af !important; text-decoration: underline; }
        /* 橫向比較 bar chart */
        .cap-bar-wrap { position: relative; }
        .cap-bar { height: 28px; border-radius: 4px; transition: width .4s ease-out, opacity .15s; min-width: 2px; display: flex; align-items: center; }
        .cap-bar:hover { opacity: .85; }
        .cap-bar-label { font-size: 11px; font-weight: 600; white-space: nowrap; padding-left: 6px; }
        .cap-compare-row { display: grid; grid-template-columns: 72px 1fr 52px; gap: 6px; align-items: center; padding: 3px 0; border-bottom: 1px solid #f3f4f6; }
        .cap-compare-row:last-child { border-bottom: none; }
        .cap-compare-row:hover { background: #f9fafb; border-radius: 6px; }
        .cap-compare-name { font-size: 12px; font-weight: 600; cursor: pointer; text-align: right; padding-right: 4px; }
        .cap-compare-name:hover { color: #1e40af; text-decoration: underline; }
        .cap-compare-name.is-yuanta { color: #ea580c; }
        .cap-compare-count { font-size: 11px; font-weight: 700; text-align: center; }
    </style>
</head>

<script>
    // ── 資料來源：Google Sheet 發布 CSV。尚未填入時退回讀本地 data/*.csv ──────────
    const PUB = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQbh-mBljvOVY586mRTKM_sduv2l2qXD-mZveOS6BvEFuKZuCc1zWwJI-eGKzg_fG7t4523aN8K7-MZ/pub';
    const SHEET = {
        taxonomy:   `${PUB}?gid=1641856889&single=true&output=csv`,
        profile:    `${PUB}?gid=376379360&single=true&output=csv`,
        capability: `${PUB}?gid=598329868&single=true&output=csv`,
    };
    const LOCAL = {
        taxonomy:   'data/peer_taxonomy.csv',
        profile:    'data/peer_profile.csv',
        capability: 'data/peer_capability.csv',
    };
    const src = k => SHEET[k].startsWith('http') ? SHEET[k] : LOCAL[k];

    const GROUP_ORDER = ['元大','國泰','富邦','中信','玉山','永豐','台新新光','凱基','兆豐','第一金','合庫','華南'];
    const STALE_MONTHS = 12;

    let TAX = [], PROFILE = [], CAP = [];
    let currentView = 'matrix', currentCompany = '元大';

    function fetchCSV(url) {
        return new Promise((resolve, reject) => {
            Papa.parse(url, {
                download: true, header: true, skipEmptyLines: true,
                complete: r => resolve(r.data), error: reject,
            });
        });
    }

    // 同一格可能有多個子公司的佐證：狀態取最高，佐證全留
    // hits＝該格的佐證條數（熱力圖色深）、subs＝涵蓋子公司數（詳頁用）
    function cellOf(group, capId) {
        const rows = CAP.filter(r => r['集團'] === group && r['能力項ID'] === capId);
        if (!rows.length) return null;
        rows.sort((a, b) => (b['最近佐證日期'] || '').localeCompare(a['最近佐證日期'] || ''));
        // 狀態取最高（已導入 > 宣示中），但「暫停」若是該格最新的佐證就蓋過去——服務停辦了就不該還顯示已導入
        const status = rows[0]['狀態'] === '暫停' ? '暫停'
            : rows.some(r => r['狀態'] === '已導入') ? '已導入' : '宣示中';
        const subs = new Set(rows.map(r => r['子公司'])).size;
        const hits = rows.length;
        return { status, rows, latest: rows[0]['最近佐證日期'] || '', subs, hits };
    }

    // Sheet 可能把 ISO 日期存成日期格，發布 CSV 會吐 2026/4/23 → 一律正規化回 YYYY-MM-DD
    const isoDate = v => {
        const m = String(v || '').trim().match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);
        return m ? `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}` : (v || '');
    };
    function normalizeDates(rows) {
        rows.forEach(r => {
            r['最近佐證日期'] = isoDate(r['最近佐證日期']);
            r['歷次佐證日期'] = (r['歷次佐證日期'] || '').split(';').map(isoDate).filter(Boolean).join(';');
        });
        return rows;
    }

    // 歷次佐證日期（同一件事被持續報導／更新的日期序列），舊到新
    function datesOf(r) {
        return (r['歷次佐證日期'] || r['最近佐證日期'] || '').split(';').map(x => x.trim()).filter(Boolean).sort();
    }

    function monthsAgo(dateStr) {
        if (!dateStr) return null;
        const d = new Date(dateStr);
        if (isNaN(d)) return null;
        return Math.max(0, Math.round((Date.now() - d) / (1000 * 60 * 60 * 24 * 30.44)));
    }

    function freshnessLabel(dateStr) {
        const m = monthsAgo(dateStr);
        if (m === null) return '';
        return m < 1 ? '最後佐證於本月' : `最後佐證於 ${m} 個月前`;
    }

    // 熱力圖色階：已導入的格子依佐證條數由淺到深（5 條以上同色）
    const HEAT = ['#a7f3d0', '#6ee7b7', '#34d399', '#10b981', '#059669', '#065f46'];
    const heatColor = hits => HEAT[Math.min(hits, HEAT.length) - 1];

    function cellStyle(c) {
        if (!c) return 'background:#e5e7eb';
        if (c.status === '暫停') return 'background:#f87171';
        if (c.status === '宣示中') return 'background:#fbbf24';
        return `background:${heatColor(c.hits)}`;
    }

    // ── 能力雷達（純 SVG）：AI 面與數金面各自一張，軸數依 taxonomy 動態決定 ────
    const SCORE = { '已導入': 1, '宣示中': 0.5, '暫停': 0 };
    // 軸標籤用看得懂的短名（\n 換行），不用 A1/B1 代號
    const SHORT_NAME = {
        A1: '全員 AI', A2: '金融語言\n模型', A3: 'AI 治理\n與算力',
        A4: '核心作業\n自動化',  A5: '對客與\n個人化',  A6: 'AI 防詐\n交易監控',
        B1: '數位帳戶\n線上化',  B2: '支付與\n跨境',  B3: '企金\n數位化',
        B4: '財管\n數位化',      B5: '資安與\n數位身分',  B6: '區塊鏈\n虛擬資產',
        B7: '防詐聯防\nAML 制度',
    };
    const SIDE_COLOR = { AI: { fill: '#059669', line: '#047857' }, '數金': { fill: '#2563eb', line: '#1d4ed8' } };
    const AI_FILL = SIDE_COLOR.AI.fill, FIN_FILL = SIDE_COLOR['數金'].fill;
    const axesOf = side => TAX.filter(t => t['面'] === side);

    // rows → 該側每個能力項的「佐證條數」（雷達半徑的基底，與熱力圖同一個量）
    const RADAR_MAX = 5;                       // 固定刻度：5 條佐證以上就到最外圈
    function scoresFrom(rows, side) {
        return axesOf(side).map(t => rows.filter(r => r['能力項ID'] === t['能力項ID']).length);
    }
    // 該格有沒有「已導入」——只用來決定點的實心／空心
    function hasDone(rows, capId) {
        return rows.some(r => r['能力項ID'] === capId && r['狀態'] === '已導入');
    }

    function radarSVG(series, side, size, opt = {}) {
        const axes = axesOf(side), n = axes.length;
        const pad = opt.pad ?? 48, R = size / 2 - pad, cx = size / 2, cy = size / 2;
        const { fill, line } = SIDE_COLOR[side];
        const ang = i => Math.PI * 2 * i / n - Math.PI / 2;
        const pt = (i, r) => [(cx + Math.cos(ang(i)) * R * r).toFixed(1), (cy + Math.sin(ang(i)) * R * r).toFixed(1)];
        const ring = r => axes.map((_, i) => pt(i, r).join(',')).join(' ');

        const list = Array.isArray(series[0]) || typeof series[0] === 'object' ? series : [{ scores: series }];
        const nfs = size > 240 ? 10 : 9;
        const scaleMax = RADAR_MAX;                 // 固定刻度，跨集團／跨子公司可直接比
        const radiusOf = n => Math.min(n, RADAR_MAX) / RADAR_MAX;
        const grid = [1, .667, .333].map(r =>
            `<polygon points="${ring(r)}" fill="none" stroke="#e5e7eb" stroke-width="1"/>`).join('')
            + `<text x="${cx + 3}" y="${cy - R - 2}" font-size="8" fill="#cbd5e1">${scaleMax}</text>`;
        const spokes = axes.map((_, i) =>
            `<line x1="${cx}" y1="${cy}" x2="${pt(i, 1)[0]}" y2="${pt(i, 1)[1]}" stroke="#e5e7eb" stroke-width="1"/>`).join('');
        const overlay = list.length > 1;
        // 集團整體先畫（當底），子公司疊在上面且只描線，才不會被罩住
        const ordered = overlay ? [...list.filter(se => se.emphasis), ...list.filter(se => !se.emphasis)] : list;
        const shapes = ordered.map(se => {
            const st = se.stroke || line, fl = se.fill || fill;
            const solo = !overlay || se.emphasis;
            return `<polygon points="${se.scores.map((v, i) => pt(i, Math.max(radiusOf(v), 0.015)).join(',')).join(' ')}"
                    fill="${solo ? fl : 'none'}" fill-opacity="${overlay ? .12 : .28}" stroke="${st}"
                    stroke-width="${se.emphasis ? (overlay ? 3 : 2.2) : 2}" stroke-linejoin="round"
                    stroke-opacity="${se.emphasis && overlay ? .55 : 1}"><title>${se.name || ''}</title></polygon>`;
        }).join('');
        // 只有單一序列（或被指定的主序列）才畫點與數字，疊圖時避免糊成一團
        const main = list.find(se => se.emphasis) || (list.length === 1 ? list[0] : null);
        const done = (main && main.rows) || opt.rows || [];
        const dots = !main ? '' : axes.map((t, i) => {
            const v = main.scores[i];
            if (!v) return '';
            const st = main.stroke || line;
            const [dx, dy] = pt(i, radiusOf(v));
            const [nx, ny] = pt(i, Math.min(radiusOf(v) + 0.22, 0.95));
            return `<circle cx="${dx}" cy="${dy}" r="${size > 200 ? 3 : 2.5}"
                     fill="${hasDone(done, t['能力項ID']) ? st : '#fff'}" stroke="${st}" stroke-width="1.2"
                     ><title>${t['能力項']}｜${v} 條佐證｜${hasDone(done, t['能力項ID']) ? '已導入' : '宣示中'}</title></circle>
                <text x="${nx}" y="${ny}" text-anchor="middle" dominant-baseline="middle"
                      font-size="${nfs}" font-weight="700" fill="${st}">${v}</text>`;
        }).join('');
        const ref = opt.reference ? `<polygon points="${opt.reference.map((v, i) => pt(i, Math.max(radiusOf(v), 0.02)).join(',')).join(' ')}"
                     fill="none" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 2"/>` : '';

        const fs = size > 280 ? 10 : size > 220 ? 9 : 7.5;   // 手機上的小雷達字體再縮一點
        const clickable = opt.clickable;   // 如果傳了 clickable 集團名，就加 onclick
        const labels = opt.labels === false ? '' : axes.map((t, i) => {
            const co = Math.cos(ang(i)), si = Math.sin(ang(i));
            const [x0, y0] = pt(i, Math.abs(co) < 0.25 ? 1.16 : 1.08);
            const anchor = co > 0.25 ? 'start' : co < -0.25 ? 'end' : 'middle';
            const x = (+x0 + (co > 0.25 ? 4 : co < -0.25 ? -4 : 0)).toFixed(1);
            const y = (+y0 + (si > 0.5 ? fs * 0.5 : si < -0.5 ? -fs * 0.5 : 0)).toFixed(1);
            const lines = (SHORT_NAME[t['能力項ID']] || t['能力項']).split('\n');
            const tspans = lines.map((ln, k) =>
                `<tspan x="${x}" dy="${k === 0 ? -(lines.length - 1) * fs * 0.55 : fs * 1.1}">${ln}</tspan>`).join('');
            const cls = clickable ? ' class="radar-cap-label"' : '';
            const click = clickable ? ` onclick="showRadarCap('${clickable}','${t['能力項ID']}')" style="cursor:pointer"` : '';
            return `<text x="${x}" y="${y}" text-anchor="${anchor}" dominant-baseline="middle"
                     font-size="${fs}" fill="${line}"${cls}${click}>${tspans}<title>${t['能力項']}｜${t['定義']}${clickable ? '｜點擊查看佐證' : ''}</title></text>`;
        }).join('');

        return `<svg viewBox="0 0 ${size} ${size}" width="100%" style="max-width:${size}px" class="block mx-auto">
                    ${grid}${spokes}${ref}${shapes}${dots}${labels}
                </svg>`;
    }

    const radarLegend = extra => `<div class="flex flex-wrap items-center justify-center gap-x-3 gap-y-1 text-[11px] text-gray-500 mt-1">
        <span>半徑＝該能力項的佐證條數（最外圈＝5 條以上）；實心點＝已導入、空心點＝僅宣示中</span>${extra || ''}</div>`;

    const SUB_COLORS = ['#ea580c', '#2563eb', '#7c3aed', '#0891b2', '#db2777', '#65a30d'];

    let currentSide = 'AI';   // 矩陣子 tab 預設 AI 面

    // 計算一組佐證 rows 中 AI 面 vs 數金面各幾條
    const AI_IDS = new Set();
    const FIN_IDS = new Set();
    function initSideIds() { TAX.forEach(t => (t['面'] === 'AI' ? AI_IDS : FIN_IDS).add(t['能力項ID'])); }
    const sideSplit = rows => {
        const ai = rows.filter(r => AI_IDS.has(r['能力項ID'])).length;
        return { ai, fin: rows.length - ai };
    };
    const svgAI = `<svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/></svg>`;
    const svgFin = `<svg class="w-3 h-3 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>`;
    const splitBadge = ({ ai, fin }) =>
        `<div class="flex items-center gap-2 mt-1">
            <span class="inline-flex items-center gap-1 text-[11px] px-1.5 py-0.5 rounded" style="color:${AI_FILL};background:${AI_FILL}1a">${svgAI} AI ${ai}</span>
            <span class="inline-flex items-center gap-1 text-[11px] px-1.5 py-0.5 rounded" style="color:${FIN_FILL};background:${FIN_FILL}1a">${svgFin} 數金 ${fin}</span>
        </div>`;

    function renderMatrixStats() {
        if (!AI_IDS.size) initSideIds();
        const host = document.getElementById('matrixStats');
        const now = new Date();
        const thisMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
        const threeMonthsAgo = new Date(now);
        threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
        const threeMAgoStr = `${threeMonthsAgo.getFullYear()}-${String(threeMonthsAgo.getMonth() + 1).padStart(2, '0')}`;

        // 本月新增佐證
        const thisMonthRows = CAP.filter(r => (r['最近佐證日期'] || '').slice(0, 7) === thisMonth);
        const thisMonthCount = thisMonthRows.length;

        // 近三月新增佐證 & 最活躍集團（分 AI / 數金）
        const recent3 = CAP.filter(r => (r['最近佐證日期'] || '').slice(0, 7) >= threeMAgoStr);
        const recent3Count = recent3.length;
        const recent3AI = recent3.filter(r => AI_IDS.has(r['能力項ID']));
        const recent3FIN = recent3.filter(r => FIN_IDS.has(r['能力項ID']));
        const topGroups = rows => {
            const gc = {};
            rows.forEach(r => { gc[r['集團']] = (gc[r['集團']] || 0) + 1; });
            return Object.entries(gc).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([g, c]) => `${g}(${c})`);
        };
        const topAI3 = topGroups(recent3AI);
        const topFIN3 = topGroups(recent3FIN);

        // 元大涵蓋子分類
        const yuantaRows = CAP.filter(r => r['集團'] === '元大');
        const yuantaCaps = new Set(yuantaRows.map(r => r['能力項ID']));
        const yuantaCoverage = yuantaCaps.size;
        const yuantaAI = [...yuantaCaps].filter(id => AI_IDS.has(id)).length;
        const aiTotal = TAX.filter(t => t['面'] === 'AI').length;
        const finTotal = TAX.filter(t => t['面'] === '數金').length;

        const card = (icon, label, value, sub, split) => `
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 flex items-start gap-3">
                <div class="w-9 h-9 rounded-lg bg-gray-100 flex items-center justify-center flex-shrink-0">${icon}</div>
                <div class="min-w-0">
                    <div class="text-xs text-gray-400 mb-0.5">${label}</div>
                    <div class="text-lg font-bold text-gray-800">${value}</div>
                    ${sub ? `<div class="text-xs text-gray-500 mt-0.5">${sub}</div>` : ''}
                    ${split || ''}
                </div>
            </div>`;

        host.innerHTML =
            card(`<svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>`, `本月新增佐證（${thisMonth.replace('-', '/')}）`, `${thisMonthCount} 條`,
                 thisMonthCount ? `涵蓋 ${new Set(thisMonthRows.map(r => r['集團'])).size} 個集團` : '本月尚無新增',
                 thisMonthCount ? splitBadge(sideSplit(thisMonthRows)) : '')
          + card(`<svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>`, '近三月新增佐證', `${recent3Count} 條`, '',
                 recent3Count ? `${splitBadge(sideSplit(recent3))}
                    <div class="mt-1.5 space-y-0.5 text-[11px] text-gray-500">
                        ${topAI3.length ? `<div><span style="color:${AI_FILL}">▸ AI 最活躍：</span>${topAI3.join('、')}</div>` : ''}
                        ${topFIN3.length ? `<div><span style="color:${FIN_FILL}">▸ 數金最活躍：</span>${topFIN3.join('、')}</div>` : ''}
                    </div>` : '')
          + card(`<svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>`, '元大涵蓋能力子分類', `${yuantaCoverage} / ${TAX.length} 項`,
                 `涵蓋率 ${Math.round(yuantaCoverage / TAX.length * 100)}%`,
                 `<div class="flex items-center gap-2 mt-1">
                    <span class="inline-flex items-center gap-1 text-[11px] px-1.5 py-0.5 rounded" style="color:${AI_FILL};background:${AI_FILL}1a">${svgAI} AI ${yuantaAI}/${aiTotal}</span>
                    <span class="inline-flex items-center gap-1 text-[11px] px-1.5 py-0.5 rounded" style="color:${FIN_FILL};background:${FIN_FILL}1a">${svgFin} 數金 ${yuantaCoverage - yuantaAI}/${finTotal}</span>
                 </div>`);
    }

    function renderMatrix(side) {
        if (side) currentSide = side;
        const filteredTax = TAX.filter(t => t['面'] === currentSide);
        const host = document.getElementById('matrixHost');
        let h = '<table class="matrix text-xs border-separate" style="border-spacing:3px;"><thead><tr>'
              + '<th class="sticky-col text-left px-2 py-1 font-semibold text-gray-500">能力項</th>';
        GROUP_ORDER.forEach(g => {
            const me = g === '元大';
            h += `<th class="px-1 py-1 align-bottom ${me ? 'text-orange-600' : 'text-gray-600'}">
                    <button onclick="showCompany('${g}')" class="font-semibold whitespace-nowrap hover:underline">${g}</button>
                  </th>`;
            if (me) h += '<th class="w-2"></th>';   // 元大與同業之間留一道視覺分隔
        });
        h += '</tr></thead><tbody>';

        filteredTax.forEach(t => {
            h += `<tr><td class="sticky-col px-2 py-1 whitespace-nowrap font-medium text-gray-700" title="${t['定義']}">
                    <span class="cap-label" onclick="showCapCompare('${t['能力項ID']}')" title="點擊查看 12 家橫向比較">
                        <span class="text-gray-400 mr-1">${t['能力項ID']}</span>${t['能力項']}
                    </span></td>`;
            GROUP_ORDER.forEach(g => {
                const c = cellOf(g, t['能力項ID']);
                const detail = c ? `${c.status}｜${c.hits} 條佐證` : '未見佐證';
                h += `<td class="px-1 py-1 text-center">
                        <div class="cell w-7 h-7 mx-auto rounded" style="${cellStyle(c)}"
                             onclick="showCell('${g}','${t['能力項ID']}')"
                             title="${g}｜${t['能力項']}｜${detail}"></div>
                      </td>`;
                if (g === '元大') h += '<td class="border-r border-gray-200"></td>';
            });
            h += '</tr>';
        });
        h += '</tbody></table>';
        host.innerHTML = h;

        // 更新子 tab 視覺狀態
        document.querySelectorAll('.side-tab').forEach(b => {
            const on = b.dataset.side === currentSide;
            b.classList.toggle('bg-white', on);
            b.classList.toggle('shadow-sm', on);
            b.classList.toggle('text-blue-900', on);
            b.classList.toggle('text-gray-500', !on);
        });

        // 切換側時，收合已展開的面板
        const capBox = document.getElementById('capCompare');
        if (capBox) {
            capBox.classList.add('hidden');
            capBox.dataset.capId = '';
        }
        const cellBox = document.getElementById('cellDetail');
        if (cellBox) {
            cellBox.classList.add('hidden');
        }
    }

    function evidenceHTML(rows, hideSub) {
        return rows.map(r => {
            const stale = monthsAgo(r['最近佐證日期']) >= STALE_MONTHS;
            // 找出同一則新聞對應的所有能力項（同 URL＋說明＋子公司）
            const related = CAP.filter(x => x['子公司'] === r['子公司'] && x['說明'] === r['說明'] && x['佐證URL'] === r['佐證URL']);
            const caps = [];
            related.forEach(x => { const t = TAX.find(tx => tx['能力項ID'] === x['能力項ID']); if (t && !caps.some(c => c['能力項ID'] === t['能力項ID'])) caps.push(t); });
            // 綠／藍在本站專指 AI 面／數金面，佐證卡片本身一律中性灰（宣示中維持琥珀）
            return `<div class="border-l-2 ${r['狀態'] === '已導入' ? 'border-slate-300' : 'border-amber-400'} pl-3 py-1.5 ${stale ? 'stale' : ''}">
                <div class="flex flex-wrap items-center gap-2 text-xs mb-0.5">
                    ${hideSub ? '' : `<span class="px-1.5 py-0.5 rounded bg-gray-100 font-medium">${r['子公司']}</span>`}
                    <span class="px-1.5 py-0.5 rounded ${r['狀態'] === '已導入' ? 'bg-slate-100 text-slate-600' : 'bg-amber-50 text-amber-700'}">${r['狀態']}</span>
                    ${datesOf(r).length > 1
                        ? `<span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-600" title="同一件事被報導／更新的日期：${datesOf(r).join('、')}">推進 ${datesOf(r).length} 次</span>` : ''}
                    <span class="text-gray-400">${freshnessLabel(r['最近佐證日期'])}${stale ? '（資訊較舊）' : ''}</span>
                </div>
                <p class="text-sm text-gray-700 leading-relaxed">${r['說明']}</p>
                <a href="${r['佐證URL']}" target="_blank" rel="noopener"
                   class="text-xs text-cyan-800 hover:text-cyan-900 underline decoration-cyan-200 hover:decoration-cyan-500 underline-offset-2 break-all">↗ ${r['佐證標題']}（${r['最近佐證日期']}）</a>
                ${caps.length ? hashTags(caps) : ''}
            </div>`;
        }).join('');
    }

    // 一則新聞常同時對到多個能力項，逐項列會重複出現。以「日期＋子公司＋來源＋說明」併成一筆，
    // 能力項改用 hashtag 掛在下面。items = [{ r, d }]
    function groupNews(items) {
        const g = new Map();
        items.forEach(({ r, d }) => {
            const k = [d, r['子公司'], r['佐證URL'] || r['佐證標題'], r['說明']].join('|');
            if (!g.has(k)) g.set(k, { r, d, caps: [] });
            const t = TAX.find(x => x['能力項ID'] === r['能力項ID']);
            if (t && !g.get(k).caps.some(x => x['能力項ID'] === t['能力項ID'])) g.get(k).caps.push(t);
        });
        return [...g.values()];
    }

    const hashTags = caps => `<div class="flex flex-wrap gap-1 mt-1 pl-3">${caps.map(t => {
        const c = t['面'] === 'AI' ? AI_FILL : FIN_FILL;   // 與雷達圖、時間線同色
        return `<span class="text-[11px] px-1.5 py-0.5 rounded" title="${t['能力項']}｜${t['定義']}"
                 style="color:${c};background:${c}1a">#${(SHORT_NAME[t['能力項ID']] || t['能力項']).replace(/\n/g, '')}</span>`;
    }).join('')}</div>`;

    const newsHTML = (items, hideSub, head) => groupNews(items).map(({ r, d, caps }) => `<div class="py-1">
            ${head ? `<div class="text-xs text-gray-500 mb-0.5">${d}｜${r['子公司']}${d === r['最近佐證日期'] ? '' : '・先前的推進紀錄'}</div>` : ''}
            ${evidenceHTML([r], hideSub)}</div>`).join('');

    const byLatest = rows => rows.slice()
        .sort((x, y) => (y['最近佐證日期'] || '').localeCompare(x['最近佐證日期'] || ''))
        .map(r => ({ r, d: r['最近佐證日期'] }));

    function showCell(group, capId) {
        const t = TAX.find(x => x['能力項ID'] === capId);
        const c = cellOf(group, capId);
        const box = document.getElementById('cellDetail');
        box.classList.remove('hidden');
        box.innerHTML = `
            <div class="flex items-start justify-between gap-3 mb-3">
                <div>
                    <h3 class="font-semibold text-gray-800">${group}｜${t['能力項']}</h3>
                    <p class="text-xs text-gray-500 mt-0.5">${t['定義']}</p>
                </div>
                <button onclick="document.getElementById('cellDetail').classList.add('hidden')"
                        class="text-gray-400 hover:text-gray-600 text-sm">✕</button>
            </div>
            ${c ? `<div class="space-y-2">${evidenceHTML(c.rows)}</div>`
                : `<p class="text-sm text-gray-500">未見佐證——公開資訊中尚未看到 ${group} 在此能力項的動作。這不等於對方未導入。</p>`}`;
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        // 關掉能力項橫向比較（避免兩個面板同時開）
        document.getElementById('capCompare').classList.add('hidden');
        document.querySelectorAll('.cap-label.active').forEach(el => el.classList.remove('active'));
    }

    // ── 能力項橫向比較（12 家水平條形圖）────────────────────────────
    function showCapCompare(capId) {
        const t = TAX.find(x => x['能力項ID'] === capId);
        if (!t) return;
        const box = document.getElementById('capCompare');
        // 再點同一個能力項 → 收合
        if (!box.classList.contains('hidden') && box.dataset.capId === capId) {
            box.classList.add('hidden');
            box.dataset.capId = '';
            document.querySelectorAll('.cap-label.active').forEach(el => el.classList.remove('active'));
            return;
        }
        box.dataset.capId = capId;
        // 關掉格子佐證面板
        document.getElementById('cellDetail').classList.add('hidden');
        // 高亮當前選中的能力項名稱
        document.querySelectorAll('.cap-label.active').forEach(el => el.classList.remove('active'));
        const clicked = document.querySelector(`.cap-label[onclick*="'${capId}'"]`);
        if (clicked) clicked.classList.add('active');

        // 收集 12 家數據
        const data = GROUP_ORDER.map(g => {
            const c = cellOf(g, capId);
            return { group: g, hits: c ? c.hits : 0, status: c ? c.status : '未見佐證', latest: c ? c.latest : '', subs: c ? c.subs : 0 };
        });
        const maxHits = Math.max(1, ...data.map(d => d.hits));

        // 狀態 badge
        const statusBadge = s => {
            if (s === '已導入') return '<span class="text-[11px] px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700">已導入</span>';
            if (s === '宣示中') return '<span class="text-[11px] px-1.5 py-0.5 rounded bg-amber-100 text-amber-700">宣示中</span>';
            return '<span class="text-[11px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-400">未見佐證</span>';
        };

        // bar 顏色
        const barColor = d => {
            if (d.status === '未見佐證') return '#e5e7eb';
            if (d.status === '宣示中') return '#fbbf24';
            return heatColor(d.hits);
        };

        const rows = data.map((d, idx) => {
            const pct = d.hits > 0 ? Math.max(d.hits / maxHits * 100, 4) : 2;
            const isYuanta = d.group === '元大';
            return `<div class="cap-compare-row" style="cursor:pointer" onclick="toggleCapEvidence('${d.group}','${capId}',${idx})" title="點擊展開 ${d.group} 的佐證">
                <div class="cap-compare-name ${isYuanta ? 'is-yuanta' : ''}" onclick="event.stopPropagation();showCompany('${d.group}')" title="點擊進入 ${d.group} 詳頁">${d.group}</div>
                <div class="cap-bar-wrap">
                    <div class="cap-bar" style="width:${pct}%;background:${barColor(d)};${isYuanta ? 'box-shadow:0 0 0 2px #ea580c33;' : ''}">
                        ${d.hits > 0 ? `<span class="cap-bar-label" style="color:${d.hits >= 3 ? '#fff' : '#374151'}">${d.hits} 條</span>` : ''}
                    </div>
                </div>
                <div class="flex items-center gap-1">${statusBadge(d.status)}</div>
            </div>
            <div id="capEv-${idx}" class="hidden"></div>`;
        }).join('');

        // 統計摘要
        const adopted = data.filter(d => d.status === '已導入').length;

                <div class="rounded-lg bg-amber-50 px-3 py-2">

    function toggleCapEvidence(group, capId, idx) {
        const el = document.getElementById('capEv-' + idx);
        if (!el) return;
        if (!el.classList.contains('hidden')) {
            el.classList.add('hidden');
            el.innerHTML = '';
            return;
        }
        // 關閉其他已展開的佐證
        document.querySelectorAll('[id^="capEv-"]').forEach(x => { x.classList.add('hidden'); x.innerHTML = ''; });
        const c = cellOf(group, capId);
        const t = TAX.find(x => x['能力項ID'] === capId) || {};
        el.classList.remove('hidden');
        el.innerHTML = `<div class="border border-gray-200 rounded-lg bg-gray-50 p-3 mb-1">
            <div class="flex items-start justify-between gap-2 mb-2">
                <h4 class="font-semibold text-sm text-gray-700">${group}｜${t['能力項'] || capId}</h4>
                <button onclick="event.stopPropagation();document.getElementById('capEv-${idx}').classList.add('hidden');document.getElementById('capEv-${idx}').innerHTML=''"
                        class="text-gray-400 hover:text-gray-600 text-xs">✕</button>
            </div>
            ${c ? `<div class="space-y-2">${evidenceHTML(c.rows)}</div>`
                : `<p class="text-sm text-gray-500">未見佐證——公開資訊中尚未看到 ${group} 在此能力項的動作。這不等於對方未導入。</p>`}
        </div>`;
    }

    // 佐證時間線：按月分欄，每則佐證一個點（AI／數金分色），同月往上疊
    // key＝這條時間線的識別（集團一條、每個事業體各一條），點月份時要靠它找回自己的資料與詳情框
    const TL_SCOPE = {};
    function timelineHTML(rows, key = 'g', compact = false) {
        TL_SCOPE[key] = rows;
        // 一條佐證可能有多個歷次日期，每個日期都落一點
        const dated = rows.flatMap(r => datesOf(r).map(d => ({ r, d })));
        if (!dated.length) return '<p class="text-sm text-gray-400">尚無可排序的佐證日期</p>';
        const months = [...new Set(CAP.flatMap(r => datesOf(r)).map(d => d.slice(0, 7)))].sort();
        const byMonth = new Map(months.map(m => [m, []]));
        dated.forEach(x => { const m = x.d.slice(0, 7); if (byMonth.has(m)) byMonth.get(m).push(x); });
        const maxStack = Math.max(3, ...[...byMonth.values()].map(v => v.length));
        const H = maxStack * 13 + 8;

        const cols = months.map(m => {
            const rs = byMonth.get(m).sort((a, b) => a.d.localeCompare(b.d));
            const dots = rs.map(({ r, d }) => {
                const side = (r['能力項ID'] || '')[0] === 'A' ? 'AI' : '數金';
                const t = TAX.find(x => x['能力項ID'] === r['能力項ID']) || {};
                const latest = d === r['最近佐證日期'];
                return `<span class="w-2.5 h-2.5 rounded-full block" style="background:${side === 'AI' ? AI_FILL : FIN_FILL};opacity:${latest ? 1 : .45}"
                          title="${d}｜${r['子公司']}｜${t['能力項'] || ''}（${r['狀態']}）${latest ? '' : '・先前的推進紀錄'}"></span>`;
            }).join('');
            return `<div class="${rs.length ? 'tl-col' : ''} flex flex-col-reverse items-center gap-0.5 flex-1 min-w-[14px]"
                         style="height:${H}px" ${rs.length ? `onclick="showTLMonth('${m}','${key}',this)"` : ''}>${dots}</div>`;
        }).join('');

        const ticks = months.map((m, i) => {
            const show = m.endsWith('-01') || m.endsWith('-04') || m.endsWith('-07') || m.endsWith('-10') || i === months.length - 1;
            return `<div class="flex-1 min-w-[14px] text-center text-[9px] text-gray-400 ${show ? '' : 'invisible'}">${m.slice(2).replace('-', '/')}</div>`;
        }).join('');

        return `<div class="flex items-end gap-0.5">${cols}</div>
                <div class="border-t border-gray-200 mt-1 pt-1 flex gap-0.5">${ticks}</div>
                ${compact
                    ? '<p class="text-[11px] text-gray-400 mt-1">一點＝一次佐證；點某個月份看那個月的新聞</p>'
                    : `<p class="text-[11px] text-gray-400 mt-1">一點＝一次佐證（同一件事的歷次推進都會落點，較淡的是先前紀錄）；點某個月份看那個月的新聞。橫跨 ${months[0]} ～ ${months[months.length - 1]}。<span class="text-gray-400">本站 2026-04 起蒐集，早期月份為回補語料、密度偏低。</span></p>`}
                <div id="tlDetail-${key}" class="hidden mt-2"></div>`;
    }

    // 點某個月份那一欄 → 列出該月所有佐證（只看這條時間線自己的資料）
    function showTLMonth(m, key, el) {
        el.parentElement.querySelectorAll('.tl-col.on').forEach(x => x.classList.remove('on'));
        el.classList.add('on');
        const items = (TL_SCOPE[key] || [])
            .flatMap(r => datesOf(r).filter(d => d.startsWith(m)).map(d => ({ r, d })))
            .sort((a, b) => a.d.localeCompare(b.d));
        const box = document.getElementById('tlDetail-' + key);
        box.classList.remove('hidden');
        box.innerHTML = `<div class="border border-gray-200 rounded-lg bg-gray-50 p-3">
            <div class="flex items-start justify-between gap-3 mb-2">
                <h4 class="font-semibold text-sm text-gray-800">${m.replace('-', ' / ')}｜${groupNews(items).length} 則新聞</h4>
                <button onclick="document.getElementById('tlDetail-${key}').classList.add('hidden')"
                        class="text-gray-400 hover:text-gray-600 text-sm">✕</button>
            </div>
            <div class="space-y-2">${newsHTML(items, true, true)}</div></div>`;
    }

    function renderCompanyTabs() {
        document.getElementById('companyTabs').innerHTML = GROUP_ORDER.map(g => {
            const on = g === currentCompany;
            const me = g === '元大';
            return `<button onclick="showCompany('${g}')"
                class="px-3 py-1.5 rounded-lg text-sm font-semibold transition
                ${on ? 'bg-blue-700 text-white shadow-sm' : me ? 'bg-orange-50 text-orange-700 border border-orange-200' : 'bg-white text-gray-600 border border-gray-300 hover:bg-blue-50'}">
                ${g}${me ? '（本行）' : ''}</button>`;
        }).join('');
    }

    function renderCompany() {
        const g = currentCompany;
        const p = PROFILE.find(r => r['集團'] === g) || {};
        const host = document.getElementById('companyHost');

        // 子公司為第一層：集團層（金控）固定最前，其次★主事業體，再其他事業體
        const parseEntities = s => (s || '').split(/[／、,\/]/).map(x => x.trim()).filter(Boolean);
        const mainEnt = parseEntities(p['主事業體']), otherEnt = parseEntities(p['其他事業體']);
        const SECTOR_RANK = ['銀行', '證券', '人壽', '產險', '投信', '期貨', '投顧'];

        const buckets = new Map();   // key → { name, sector, isMain, isGroup, rows }
        CAP.filter(r => r['集團'] === g).forEach(r => {
            const isGroup = r['業別'] === '金控';
            const key = isGroup ? '__group__' : r['子公司'];
            if (!buckets.has(key)) buckets.set(key, {
                name: isGroup ? '集團層（跨子公司）' : r['子公司'],
                sector: isGroup ? '' : r['業別'],
                isMain: false,   // 由下方 bind() 決定
                isGroup, rows: [],
            });
            buckets.get(key).rows.push(r);
        });
        // profile 與佐證的子公司命名偶有出入（例：合庫銀行 vs 合作金庫銀行）。
        // 名稱對不上時，只在「該業別只有一家」時才視為同一家，不做其他猜測。
        const list = [...buckets.values()].filter(b => !b.isGroup);
        const bind = (names, base) => names.forEach((name, i) => {
            let b = list.find(x => x.name === name && x.rank === undefined);
            if (!b) {
                const sec = SECTOR_RANK.find(s => name.endsWith(s));
                const cand = list.filter(x => x.sector === sec && x.rank === undefined);
                if (sec && cand.length === 1) b = cand[0];
            }
            if (b) { b.rank = base + i; b.isMain = base === 100; }
        });
        bind(mainEnt, 100);
        bind(otherEnt, 200);
        list.forEach(b => {
            if (b.rank === undefined) {
                const s = SECTOR_RANK.indexOf(b.sector);
                b.rank = 300 + (s < 0 ? SECTOR_RANK.length : s);
            }
        });
        const ordered = [...buckets.values()].sort((a, b) =>
            (a.isGroup ? 0 : a.rank) - (b.isGroup ? 0 : b.rank));
        if (pickedSubs === null) pickedSubs = ordered.map(b2 => b2.name);   // 預設全部畫上

        const subBlock = (b, i) => {
            // 一則新聞列一次（新到舊），對到的能力項用 hashtag 掛在下面
            const items = byLatest(b.rows);
            // 左側一條細時間軸：每則新聞一個點（顏色取第一個能力項的側），旁邊標日期
            const caps = `<div class="tl-rail border-l border-gray-200 ml-1 pl-4">${groupNews(items).map(({ r, caps }) => {
                const c = (caps[0] || {})['面'] === 'AI' ? AI_FILL : FIN_FILL;
                return `<div class="relative pb-3">
                    <span class="absolute -left-[21px] top-1.5 w-2 h-2 rounded-full ring-2 ring-white" style="background:${c}"></span>
                    <div class="text-[11px] text-gray-400 mb-0.5">${r['最近佐證日期']}</div>
                    ${evidenceHTML([r], true)}</div>`;
            }).join('')}</div>`;
            return `<div class="bg-white rounded-xl shadow-sm border ${b.isGroup ? 'border-blue-200' : 'border-gray-200'} p-4 sm:p-5">
                        <div class="flex flex-wrap items-center gap-2 mb-1">
                            <h3 class="font-semibold text-gray-700">${b.isMain ? '★ ' : ''}${b.name}</h3>
                            ${b.sector ? `<span class="text-[11px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500">${b.sector}</span>` : ''}
                            ${b.isMain ? '<span class="text-[11px] px-1.5 py-0.5 rounded bg-orange-50 text-orange-700">主事業體</span>' : ''}
                            <span class="text-xs text-gray-400">${new Set(b.rows.map(r => r['能力項ID'])).size} 項能力・${groupNews(items).length} 則新聞</span>
                        </div>
                        ${b.isGroup ? '<p class="text-xs text-gray-400 mb-1">掛在金控層的跨子公司動作，未再歸屬到個別子公司</p>' : ''}
                        <div class="flex flex-col sm:flex-row sm:items-start sm:gap-4">
                            <div class="min-w-0 flex-1">${caps}</div>
                            <div class="flex-shrink-0 mx-auto sm:mx-0 sm:w-96 order-first sm:order-none grid grid-cols-2 gap-1 mb-4 sm:mb-0">
                                <div><div class="text-[11px] text-center" style="color:${AI_FILL}">AI 面</div>${radarSVG(scoresFrom(b.rows, 'AI'), 'AI', 190, { pad: 44, rows: b.rows })}</div>
                                <div><div class="text-[11px] text-center" style="color:${FIN_FILL}">數金面</div>${radarSVG(scoresFrom(b.rows, '數金'), '數金', 190, { pad: 44, rows: b.rows })}</div>
                            </div>
                        </div>
                    </div>`;
        };

        const gRows = CAP.filter(r => r['集團'] === g);
        const done = TAX.filter(t => (cellOf(g, t['能力項ID']) || {}).status === '已導入').length;
        const claim = TAX.filter(t => (cellOf(g, t['能力項ID']) || {}).status === '宣示中').length;
        const missing = TAX.filter(t => !cellOf(g, t['能力項ID']));
        // 同業中位數（不含自己）作為雷達的參照虛線，兩側各算一組
        const medianOf = side => {
            const peers = GROUP_ORDER.filter(x => x !== g).map(x => scoresFrom(CAP.filter(r => r['集團'] === x), side));
            return axesOf(side).map((_, i) => {
                const v = peers.map(s => s[i]).sort((a, b) => a - b);
                return (v[Math.floor((v.length - 1) / 2)] + v[Math.ceil((v.length - 1) / 2)]) / 2;
            });
        };
        const median = { AI: medianOf('AI'), '數金': medianOf('數金') };
        // 疊圖序列：只畫各事業體（顏色依 ordered 的固定位置，開關不會換色）
        const colorOf = name => SUB_COLORS[ordered.findIndex(x => x.name === name) % SUB_COLORS.length];
        const subSeries = side => pickedSubs.map(n => {
            const b = ordered.find(x => x.name === n);
            return b && { name: n, scores: scoresFrom(b.rows, side), rows: b.rows,
                          stroke: colorOf(n), fill: colorOf(n) };
        }).filter(Boolean);

        const chip = (label, value, cls) => `<div class="rounded-lg bg-gray-50 px-3 py-2">
            <div class="text-[11px] text-gray-400">${label}</div>
            <div class="text-sm font-semibold ${cls || 'text-gray-800'}">${value}</div></div>`;

        host.innerHTML = `
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-4">
                <div class="px-4 sm:px-5 py-3 flex flex-wrap items-center gap-2"
                     style="background:${g === '元大' ? 'linear-gradient(135deg,#fff7ed,#ffedd5)' : 'linear-gradient(135deg,#eff6ff,#e0e7ff)'};">
                    <h2 class="text-lg font-semibold ${g === '元大' ? 'text-orange-700' : 'text-blue-900'}">${g}</h2>
                    ${g === '元大' ? '<span class="text-[11px] px-2 py-0.5 rounded-full bg-orange-500 text-white">本行・基準</span>' : ''}
                    <span class="text-xs text-gray-500 ml-auto">最後更新 ${p['最後更新'] || '—'}</span>
                </div>
                <div class="p-4 sm:p-5">
                    <div class="min-w-0">
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            ${chip('已導入', `${done} / ${TAX.length} 項`, 'text-emerald-700')}
                            ${chip('宣示中', `${claim} 項`, 'text-amber-600')}
                            ${chip('涵蓋子公司', `${ordered.filter(b => !b.isGroup).length} 家`)}
                            ${chip('佐證條數', `${gRows.length} 條`)}
                        </div>
                        <div class="mt-4 grid sm:grid-cols-2 gap-3 text-sm">
                            <div><span class="text-xs text-gray-400 block mb-0.5">主事業體</span>
                                 <span class="font-medium text-gray-800">${p['主事業體'] || '—'}</span></div>
                            <div><span class="text-xs text-gray-400 block mb-0.5">其他事業體</span>
                                 <span class="text-gray-600">${p['其他事業體'] || '—'}</span></div>
                        </div>
                        <div class="mt-4 border-l-2 border-blue-200 pl-3">
                            <span class="text-xs text-gray-400 block mb-1">AI 導入策略</span>
                            <p class="text-sm text-gray-700 leading-relaxed">${p['AI導入策略總述'] || '—'}</p>
                        </div>
                        <div class="mt-4">
                            <span class="text-xs text-gray-400 block mb-1">未見佐證的能力項</span>
                            ${missing.length
                                ? `<div class="flex flex-wrap gap-1.5">${missing.map(t =>
                                    `<span class="text-xs px-2 py-0.5 rounded bg-gray-100 text-gray-500" title="${t['定義']}">${t['能力項ID']} ${t['能力項']}</span>`).join('')}</div>`
                                : `<p class="text-sm text-emerald-700">無——${TAX.length} 項能力項皆有佐證</p>`}
                        </div>
                    </div>

                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 sm:p-5 mb-4">
                <h3 class="font-semibold text-gray-700 text-sm mb-1">集團能力輪廓</h3>
                <p class="text-xs text-gray-400 mb-2">各事業體疊圖比較，點事業體可開關。半徑＝該能力項的佐證條數。<span class="text-blue-500">點擊雷達上的能力項名稱可展開佐證</span></p>
                <div class="flex flex-wrap gap-1.5 mb-3">${ordered.map(b => {
                    const on = pickedSubs.includes(b.name), c = colorOf(b.name);
                    return `<button onclick="toggleSub('${b.name}')" class="px-2.5 py-1 rounded-lg text-xs font-semibold border transition"
                        style="${on ? `background:${c};border-color:${c};color:#fff` : `border-color:#d1d5db;color:#9ca3af`}">${b.isMain ? '★ ' : ''}${b.name}</button>`;
                }).join('')}</div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <div class="text-xs font-semibold text-center mb-1" style="color:${AI_FILL}">AI 面</div>
                        ${radarSVG(subSeries('AI'), 'AI', 340, { pad: 62, reference: median.AI, clickable: g })}
                    </div>
                    <div>
                        <div class="text-xs font-semibold text-center mb-1" style="color:${FIN_FILL}">數金面</div>
                        ${radarSVG(subSeries('數金'), '數金', 340, { pad: 62, reference: median['數金'], clickable: g })}
                    </div>
                </div>
                ${radarLegend(pickedSubs.map(n => `<span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm inline-block" style="background:${colorOf(n)};opacity:.8"></span>${n}</span>`).join('')
                    + '<span class="flex items-center gap-1"><span class="w-4 border-t border-dashed border-gray-400 inline-block"></span>同業中位數</span>')}
                <div id="radarCapDetail" class="hidden mt-4"></div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 sm:p-5 mb-4">
                <h3 class="font-semibold text-gray-700 text-sm mb-1">佐證時間線</h3>
                <div class="mt-2">${timelineHTML(gRows)}</div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-4 sm:p-5 mb-4">
                <h3 class="font-semibold text-gray-700 text-sm mb-2">子公司佐證明細</h3>
                <div class="flex flex-wrap gap-1.5 mb-3" id="subTabs">
                    <button onclick="filterSub('__all__')" class="sub-tab active px-3 py-1.5 rounded-lg text-xs font-semibold">全部</button>
                    ${ordered.map(b => {
                        const c = colorOf(b.name);
                        return `<button onclick="filterSub('${b.name.replace(/'/g, "\\'")}')"
                            class="sub-tab px-3 py-1.5 rounded-lg text-xs font-semibold"
                            data-sub="${b.name}"
                            data-color="${c}">${b.isMain ? '★ ' : ''}${b.name}
                            <span class="ml-1 text-[10px] opacity-70">${groupNews(byLatest(b.rows)).length}</span></button>`;
                    }).join('')}
                </div>
            </div>

            <div id="subCards" class="space-y-4">${ordered.map(subBlock).join('')}</div>`;
    }

    let pickedSubs = null;      // 詳頁疊圖的事業體；null＝預設全選
    let currentSubFilter = '__all__';   // 子公司佐證明細 tab 篩選
    function toggleSub(name) {
        const i = pickedSubs.indexOf(name);
        if (i >= 0) pickedSubs.splice(i, 1);
        else pickedSubs.push(name);
        renderCompany();
    }

    // ── 雷達圖能力項點擊 → 展開佐證面板 ──────────────────────────
    function showRadarCap(group, capId) {
        const box = document.getElementById('radarCapDetail');
        if (!box) return;
        const t = TAX.find(x => x['能力項ID'] === capId);
        if (!t) return;
        // 再點同一個 → 收合
        if (!box.classList.contains('hidden') && box.dataset.capId === capId) {
            box.classList.add('hidden');
            box.dataset.capId = '';
            return;
        }
        box.dataset.capId = capId;
        const c = cellOf(group, capId);
        const side = t['面'];
        const sideColor = side === 'AI' ? AI_FILL : FIN_FILL;
        box.classList.remove('hidden');
        box.innerHTML = `
            <div class="border rounded-lg p-4" style="border-color:${sideColor}40;background:${sideColor}08">
                <div class="flex items-start justify-between gap-3 mb-3">
                    <div>
                        <h4 class="font-semibold text-gray-800 flex items-center gap-2">
                            <span class="w-2 h-2 rounded-full inline-block" style="background:${sideColor}"></span>
                            ${group}｜${t['能力項']}
                            <span class="text-xs px-1.5 py-0.5 rounded" style="color:${sideColor};background:${sideColor}1a">${side} 面</span>
                        </h4>
                        <p class="text-xs text-gray-500 mt-0.5">${t['定義']}</p>
                    </div>
                    <button onclick="document.getElementById('radarCapDetail').classList.add('hidden');document.getElementById('radarCapDetail').dataset.capId=''"
                            class="text-gray-400 hover:text-gray-600 text-sm flex-shrink-0">✕</button>
                </div>
                ${c ? `<div class="space-y-2">${evidenceHTML(c.rows)}</div>` 
                    : `<p class="text-sm text-gray-500">未見佐證——公開資訊中尚未看到 ${group} 在此能力項的動作。這不等於對方未導入。</p>`}
            </div>`;
        box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ── 子公司 sub-tab 篩選 ──────────────────────────────────────
    function filterSub(name) {
        currentSubFilter = name;
        // 更新 tab 視覺
        document.querySelectorAll('#subTabs .sub-tab').forEach(btn => {
            const isAll = name === '__all__';
            const btnName = btn.textContent.trim().replace(/^★\s*/, '').replace(/\s*\d+$/, '');
            const on = isAll ? btn.textContent.includes('全部') : btn.dataset.sub === name;
            btn.classList.toggle('active', on);
        });
        // 顯示/隱藏卡片
        const cards = document.querySelectorAll('#subCards > div');
        cards.forEach(card => {
            if (name === '__all__') {
                card.style.display = '';
            } else {
                // 從卡片的 h3 取子公司名稱
                const h3 = card.querySelector('h3');
                const cardName = h3 ? h3.textContent.trim().replace(/^★\s*/, '') : '';
                card.style.display = cardName === name ? '' : 'none';
            }
        });
    }

    function showCompany(g) {
        currentCompany = g;
        pickedSubs = null;          // null＝尚未選過，renderCompany 會預設全選
        currentSubFilter = '__all__';   // 重設子公司篩選
        switchView('company');
        renderCompanyTabs();
        renderCompany();
        window.scrollTo({ top: 0, behavior: 'smooth' });   // 從矩陣／雷達點進來時回到詳頁頁首
    }

    function switchView(v) {
        currentView = v;
        document.getElementById('view-matrix').classList.toggle('hidden', v !== 'matrix');
        document.getElementById('view-company').classList.toggle('hidden', v !== 'company');
        document.querySelectorAll('.view-tab').forEach(b => {
            const on = b.dataset.view === v;
            b.classList.toggle('bg-white', on);
            b.classList.toggle('shadow-sm', on);
            b.classList.toggle('text-blue-900', on);
            b.classList.toggle('text-gray-500', !on);
        });
    }

    document.getElementById('menuToggle').addEventListener('click', () =>
        document.getElementById('mobileMenu').classList.toggle('hidden'));
    document.querySelectorAll('.view-tab').forEach(b =>
        b.addEventListener('click', () => switchView(b.dataset.view)));
    document.querySelectorAll('.side-tab').forEach(b =>
        b.addEventListener('click', () => renderMatrix(b.dataset.side)));

    (async function init() {
        try {
            [TAX, PROFILE, CAP] = await Promise.all(
                ['taxonomy', 'profile', 'capability'].map(k => fetchCSV(src(k))));
            normalizeDates(CAP);
        } catch (e) {
            document.getElementById('matrixHost').innerHTML =
                "<p class='text-center text-red-500 py-8'>資料載入失敗，請確認 Google Sheet 發布 URL 或 data/*.csv 是否存在</p>";
            return;
        }

        const filled = new Set(CAP.map(r => r['集團'] + '|' + r['能力項ID'])).size;
        const total = TAX.length * GROUP_ORDER.length;
        const latest = CAP.map(r => r['最近佐證日期']).filter(Boolean).sort().pop() || '—';
        document.getElementById('metaLine').textContent =
            `12 集團 × ${TAX.length} 能力項｜已有佐證 ${filled}/${total} 格（${Math.round(filled / total * 100)}%）｜最新佐證 ${latest}`;

        document.getElementById('heatLegend').innerHTML =
            HEAT.map((c, i) => `<span class="w-4 h-4 rounded inline-block" style="background:${c}" title="${i + 1}${i === HEAT.length - 1 ? ' 則以上' : ' 則佐證'}"></span>`).join('');
        renderMatrixStats();
        renderMatrix('AI');
        renderCompanyTabs();
        renderCompany();
        // 手機直接進單家視圖：矩陣在窄螢幕不好讀
        switchView(window.innerWidth < 640 ? 'company' : 'matrix');
    })();
</script>
</body>
</html>
