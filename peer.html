/* 策略全景的每個點代表一筆資料，只開該則新聞，不再展開整個交叉格。 */
function openStrategyEvidence(rowIndex,capClusterId,sceneClusterId) {
  const r=CAP[rowIndex];
  if (!r) return;
  const cg=CAP_CLUSTERS.find(x=>x.id===capClusterId);
  const sg=SCENE_CLUSTERS.find(x=>x.id===sceneClusterId);
  const st=STATE[RANK[r['狀態']]||0];
  openDrawer(`<div><div class="sec-title" style="margin-bottom:.375rem">單則佐證</div><h2 style="font-size:1rem">${esc(r['集團'])}　${esc(sg?sg.name:'')} × ${esc(cg?cg.name:'')}</h2><div style="margin-top:.4375rem"><span class="chip ${st.chip}">${esc(r['狀態'])}</span><span style="font-size:.75rem;color:var(--muted);margin-left:.375rem">1 則新聞</span></div></div>`,evidence(r));
}

function openStrategyCluster(indexList,capClusterId,sceneClusterId,q) {
  const rows=String(indexList||'').split(',').map(Number).filter(Number.isInteger).map(i=>CAP[i]).filter(Boolean);
  if (!rows.length) return;
  const cg=CAP_CLUSTERS.find(x=>x.id===capClusterId);
  const sg=SCENE_CLUSTERS.find(x=>x.id===sceneClusterId);
  const body=rows.slice().sort((a,b)=>(iso(b['最近佐證日期'])||'').localeCompare(iso(a['最近佐證日期'])||'')).map(evidence).join('');
  openDrawer(`<div><div class="sec-title" style="margin-bottom:.375rem">策略事件</div><h2 style="font-size:1rem">${esc(q)}　${esc(sg?sg.name:'')} × ${esc(cg?cg.name:'')}</h2><div style="font-size:.75rem;color:var(--muted);margin-top:.4375rem">${rows.length} 則佐證</div></div>`,body);
}

function renderOne() {
  const g = who;
  const p = PROFILE.find(x => x['集團'] === g) || {};
  const buckets = subBuckets(g);
  if (whoSub !== '__all__' && !buckets.some(b => b.key === whoSub)) whoSub = '__all__';

  const subScope = whoSub === '__all__' ? CAP.filter(r => r['集團'] === g)
                                        : (buckets.find(b => b.key === whoSub) || {rows:[]}).rows;
  const selectedWhoCap=CAP_CLUSTERS.find(cg=>cg.id===whoCap);
  const scope = selectedWhoCap ? subScope.filter(r=>capabilityClusterMatch(r,selectedWhoCap)) : subScope;
  const scopeLabels=[whoSub === '__all__' ? '' : (buckets.find(b => b.key === whoSub) || {}).name,selectedWhoCap&&selectedWhoCap.name].filter(Boolean);
  const label = scopeLabels.join(' × ') || '全集團';

  const groupRows = CAP.filter(r => r['集團'] === g);
  const activeCapClusters=CAP_CLUSTERS.filter(cg=>groupRows.some(r=>capabilityClusterMatch(r,cg))).length;
  const activeSceneClusters=SCENE_CLUSTERS.filter(sg=>groupRows.some(r=>scenesOf(r).some(s=>sg.scenes.includes(s)))).length;
  const aiRows = groupRows.filter(r => capSide(r['能力項ID']) === 'AI');
  const finRows = groupRows.filter(r => capSide(r['能力項ID']) === '數金');
  const mixTotal=aiRows.length+finRows.length;
  const aiPct=mixTotal?Math.round(aiRows.length/mixTotal*100):0;
  const finPct=mixTotal?100-aiPct:0;
  const [topCapCluster,topCapN] = CAP_CLUSTERS.map(cg=>[cg,groupRows.filter(r=>capabilityClusterMatch(r,cg)).length]).sort((a,b)=>b[1]-a[1])[0] || [{name:'—'},0];
  const [topSceneCluster,topSceneN] = SCENE_CLUSTERS.map(sg=>[sg,groupRows.filter(r=>scenesOf(r).some(s=>sg.scenes.includes(s))).length]).sort((a,b)=>b[1]-a[1])[0] || [{name:'—'},0];
  const [topSub,topSubN] = topCount(groupRows.filter(r=>r['業別']!=='金控').map(r => r['子公司']));
  const activeQs = new Set(groupRows.flatMap(datesOf).map(qOf)).size;

  /* 子公司分頁 */
  const subTabs = `<div class="subtabs">
    <button class="subtab ${whoSub==='__all__'?'on':''}" onclick="pickSub('__all__')">全部
      <span class="n">${CAP.filter(r=>r['集團']===g).length}</span></button>
    ${buckets.map(b => `<button class="subtab ${whoSub===b.key?'on':''}" onclick="pickSub('${jsq(b.key)}')">
      ${b.isMain ? '★ ' : ''}${esc(b.name)}${b.sector ? `<span style="opacity:.55;margin-left:.25rem">${esc(b.sector)}</span>` : ''}
      <span class="n">${b.rows.length}</span></button>`).join('')}
  </div>`;
  const capTypeTabs = `<div class="subtabs"><button class="subtab ${whoCap==='__all__'?'on':''}" onclick="pickWhoCap('__all__')">全部能力</button>${CAP_CLUSTERS.map(cg=>`<button class="subtab ${whoCap===cg.id?'on':''}" onclick="pickWhoCap('${cg.id}')">${esc(cg.name)}</button>`).join('')}</div>`;

  /* 導入事件（依季度分組；同一新聞命中多能力時合併為一列） */
  const scopeItems = [];
  scope.forEach(r => {
    const ds=datesOf(r), last=ds[ds.length-1];
    ds.forEach(d => scopeItems.push({r,d,g,q:qOf(d),latest:d===last}));
  });
  const scopeQs = quarterRangeFromDates(scopeItems.map(x=>x.d));
  const newsByQuarter = scopeItems.length ? quarterLog(scopeItems,scopeQs) : '<p class="empty">尚無佐證。</p>';

  return `
    <div class="controls">
      <div class="seg" role="group" aria-label="選擇集團">
        ${GROUPS.map(x => `<button class="${who===x?'on':''}" onclick="showOne('${x}')">${x}${x===ME?' ★':''}</button>`).join('')}
      </div>
    </div>

    <div class="card card-pad">
      <div class="grouphead">
        <div style="flex:1;min-width:18rem">
          <h2 style="font-size:1.5rem;font-weight:700;color:${g===ME?'var(--accent)':'var(--navy)'}">${g}${g===ME?' ★':''}</h2>
          <p style="font-size:.875rem;font-weight:600;color:var(--ink-2);margin-top:.25rem">${esc(p['主事業體']||'')}</p>
          <p style="font-size:.75rem;color:var(--muted)">${esc(p['其他事業體']||'')}</p>
        </div>
        <div style="display:flex;gap:1.5rem;flex-wrap:wrap">
          ${[[`${activeSceneClusters}/6`,'個場景'],[`${activeCapClusters}/13`,'個能力項'],[buckets.filter(b=>!b.isGroup).length,'家子公司'],
             [CAP.filter(r=>r['集團']===g).length,'條佐證']].map(([n,l]) =>
            `<div><div style="font-size:1.5rem;font-weight:700">${n}</div>
             <div style="font-size:.75rem;color:var(--ink-2)">${l}</div></div>`).join('')}
        </div>
      </div>
      <div style="border-top:1px solid var(--rule);margin-top:1.125rem;padding-top:1.125rem">
        <div class="sec-title">AI／數金導入策略摘要</div>
        <div class="strategy-readout">
          <div class="readout"><div class="rk">AI／數金佐證組合</div><div class="mix-bar" title="AI ${aiPct}%・數金 ${finPct}%"><i class="ai" style="width:${aiPct}%"></i><i class="fin" style="width:${finPct}%"></i></div><div class="mix-values"><span style="--mix:var(--ai)"><i></i>AI <b>${aiPct}%</b>・${aiRows.length} 筆</span><span style="--mix:var(--fin)"><i></i>數金 <b>${finPct}%</b>・${finRows.length} 筆</span></div><div class="rs">依能力佐證筆數計算，不代表預算占比</div></div>
          <div class="readout"><div class="rk">重點能力類型</div><div class="rv">${esc(topCapCluster.name)}</div><div class="rs">${topCapN} 條佐證</div></div>
          <div class="readout"><div class="rk">重點場景</div><div class="rv">${esc(topSceneCluster.name)}</div><div class="rs">${topSceneN} 條佐證</div></div>
          <div class="readout"><div class="rk">推進主體與節奏</div><div class="rv">${esc(topSub)}</div><div class="rs">${topSubN} 條・活躍於 ${activeQs} 個季度</div></div>
        </div>
        ${p['AI導入策略總述'] ? `<details style="margin-top:.875rem"><summary class="linkout" style="cursor:pointer">閱讀研究判讀與策略脈絡</summary><p style="font-size:.8125rem;color:var(--ink-2);line-height:1.75;margin-top:.625rem">${esc(p['AI導入策略總述'])}</p></details>` : ''}
        <p class="footnote" style="margin-top:.5rem">資料最後更新 ${esc(p['最後更新']||'—')}</p>
      </div>
    </div>

    <div class="card card-pad" style="margin-top:1rem">
      <div class="strategy-panorama-head"><div>
        <div class="sec-title" style="margin-bottom:.375rem">Strategy panorama</div>
        <div class="h3">${g} 策略全景</div>
        <p class="footnote" style="margin-top:.25rem">縱向看能力布局，橫向看推進時間，節點直接標示落地場景；同一能力、季度與場景的多筆佐證會合併成一個節點。</p>
      </div></div>
      <div class="panorama-filter is-compact"><div class="panorama-filter-group"><span class="panorama-filter-group-label">推進主體</span>${subTabs}</div>
        <details class="panorama-advanced" ${whoCap!=='__all__'?'open':''}><summary>進階能力篩選${selectedWhoCap?`：${esc(selectedWhoCap.name)}`:''}</summary><div class="panorama-advanced-body"><div class="panorama-filter-group"><span class="panorama-filter-group-label">能力類型</span>${capTypeTabs}</div></div></details>
      </div>
      ${strategyPanoramaMap(g,whoSub==='__all__'?buckets:buckets.filter(b=>b.key===whoSub),scope,groupRows,whoCap)}
    </div>

    <div class="card card-pad" style="margin-top:1rem">
      <div class="h3" style="margin-bottom:.25rem">導入事件${whoSub==='__all__'?'':`：${esc(label)}`}</div>
      <p class="footnote" style="margin-bottom:.75rem">按季度由新到舊；同一則新聞若命中多項能力會合併呈現，並完整保留子公司、AI／數金能力與場景標籤。</p>
      ${newsByQuarter}
    </div>`;
}

/* =========================================================================

   ========================================================================= */
function openDrawer(head, body) {
  document.getElementById('drawerHead').innerHTML = head;
  document.getElementById('drawerBody').innerHTML = body;
  document.getElementById('mask').classList.add('open');
  document.getElementById('drawer').classList.add('open');
  hideTip();
}
function closeDrawer() {
  document.getElementById('mask').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

function evidence(r) {
  const url = r['佐證URL'] || '';
  const dates = datesOf(r);
  const tag = t => t ? `<span class="tag">${esc(t)}</span>` : '';
  const inner = `
    <div style="display:flex;align-items:center;gap:.375rem;flex-wrap:wrap;margin-bottom:.4375rem">
      <span style="font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums">${esc(iso(r['最近佐證日期'])||'日期不明')}</span>
      ${tag(r['子公司'])}${tag(r['業別'])}
      <span class="chip ${STATE[RANK[r['狀態']]||0].chip}">${esc(r['狀態'])}</span>
      ${url ? '<span class="linkout" style="margin-left:auto">開新聞 ↗</span>' : ''}
    </div>
    <p style="font-size:.875rem;line-height:1.7">${esc(r['說明'])}</p>
    <p style="font-size:.75rem;color:var(--muted);margin-top:.375rem">${esc(r['佐證標題']||'')}</p>
    <div style="margin-top:.4375rem;display:flex;gap:.25rem;flex-wrap:wrap;align-items:center">
      ${capabilityTypesOf(r).map(cg=>`<span class="chip ai">${esc(cg.name)}</span>`).join('')}
      ${sceneClustersOf(r).map(sg => `<span class="tag">${esc(sg.name)}</span>`).join('')}
      ${dates.length > 1 ? `<span class="tag">歷次 ${dates.length} 次：${dates.join('、')}</span>` : ''}
    </div>`;
  return url
    ? `<a class="ev" href="${esc(url)}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="ev">${inner}</div>`;
}

function drawerFor(g, title, cell, footer, emptyNote) {
  const st = STATE[cell.state];
  const body = cell.rows.length
    ? cell.rows.slice().sort((a,b) => (iso(b['最近佐證日期'])||'').localeCompare(iso(a['最近佐證日期'])||''))
        .map(evidence).join('')
    : `<p class="empty">這一格尚無佐證。</p><p class="footnote">${esc(emptyNote||'')}</p>`;
  openDrawer(
    `<div>
      <div style="font-size:1.0625rem;font-weight:700">${esc(g)}　${title}</div>
      <div style="font-size:.75rem;color:var(--ink-2);margin-top:.3125rem;display:flex;gap:.375rem;align-items:center;flex-wrap:wrap">
        <span class="chip ${st.chip}">${st.glyph} ${st.label}</span>
        ${cell.rows.length ? `<span>${cell.rows.length} 條佐證・${cell.first} 起</span>` : ''}
        ${cell.stale ? `<span class="chip stale">逾 ${STALE_MONTHS} 個月未更新</span>` : ''}
      </div>
    </div>`,
    body + `<div style="display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;margin-top:1.25rem;padding-top:1rem;border-top:1px solid var(--rule)">
      ${footer}
      <button class="linkout" onclick="showOne('${g}')">看 ${esc(g)} 的單家詳頁 →</button>
    </div>`);
}

const openCell = (g, c) => drawerFor(g,
  esc(capName(c)),
  cellOf(g, c),
  '<span class="footnote">能力類型與場景已列於每則佐證下方。</span>',
  `能力項定義：${capDef(c)}`);

const openSceneCell = (g, s) => drawerFor(g, esc(s), sceneCellOf(g, s),
  `<button class="linkout" onclick="showScene('${jsq(s)}')">看「${esc(s)}」全業界誰在做 →</button>`,
  `六大場景之一：${esc(s)}`);

const openComboCell = (g, c, s) => drawerFor(g,
  `${esc(capName(c))}<br><span style="font-size:.8125rem">應用於 ${esc(s)}</span>`,
  comboCellOf(g,c,s),
  `<button class="linkout" onclick="showScene('${jsq(s)}')">看「${esc(s)}」的同業比較 →</button>`,
  `能力：${capDef(c)}；場景：${esc(s)}`);

function openCrossCell(g, capClusterId, sceneClusterId) {
  const cg=CAP_CLUSTERS.find(x=>x.id===capClusterId), sg=SCENE_CLUSTERS.find(x=>x.id===sceneClusterId);
  if (!cg || !sg) return;
  drawerFor(g, `${esc(sg.name)} × ${esc(cg.name)}`, crossCell(g,cg,sg),
    `<span class="footnote">能力類型與場景已列於每則佐證下方。</span>`,
    '公開資訊中尚未找到這個交叉組合的導入佐證。');
}

/* =========================================================================
   Shell
   ========================================================================= */
function renderTiles() {
  const total = GROUPS.length * CAPS.length;
  const cov = GROUPS.reduce((n,g) => n + groupCov(g), 0);
  const meCov = groupCov(ME);
  const peer = GROUPS.filter(g => g !== ME).map(groupCov).sort((a,b) => a-b);
  const median = peer.length % 2 ? peer[(peer.length-1)/2]
    : Math.round((peer[peer.length/2 - 1] + peer[peer.length/2]) / 2);
  const rank = GROUPS.slice().sort((a,b) => groupCov(b) - groupCov(a)).indexOf(ME) + 1;
  const latest = CAP.map(r => iso(r['最近佐證日期'])).filter(Boolean).sort().pop() || '—';
  const stale = [...CELL.values()].filter(c => c.stale).length;
  const tile = (k,v,s,cls='') =>
    `<div class="tile ${cls}"><div class="k">${k}</div><div class="v">${v}</div><div class="s">${s}</div></div>`;
  document.getElementById('tiles').innerHTML =
    tile('矩陣覆蓋率', `${cov}<small>/${total}</small>`, `${Math.round(cov/total*100)}% 的格子有佐證・${CAP.length} 條原始佐證`) +
    tile('元大覆蓋', `${meCov}<small>/13</small>`, `12 家中排第 ${rank}・同業中位數 ${median}/13`, 'me') +
    tile('最新佐證', `<span class="date">${latest}</span>`, '資料最後更新日') +
    tile('資訊較舊', `${stale}<small> 格</small>`, `最近佐證已逾 ${STALE_MONTHS} 個月`);
}

function render() {
  hideTip();   // 被 hover 的圓點即將被換掉，mouseleave 不會再觸發
  document.getElementById('panel').innerHTML =
    view === 'landscape' ? renderLandscape() :
    view === 'scene'  ? renderScene()  :
    view === 'cap'    ? renderCap()    :
    renderOne();
  const tabFor = (view === 'scene' || view === 'cap') ? 'landscape' : view;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === tabFor));
}
function go(v) { view = v; render(); }
function showCap(c)   { capId = c;   view = 'cap';         closeDrawer(); render(); scrollTo({top:0,behavior:'smooth'}); }
function showScene(s) { sceneId = s; view = 'scene'; closeDrawer(); render(); scrollTo({top:0,behavior:'smooth'}); }
function showOne(g)   { if (g !== who) { whoSub = '__all__'; whoCap = '__all__'; whoScene = '__all__'; } who = g; view = 'one'; closeDrawer(); render(); scrollTo({top:0,behavior:'smooth'}); }
function pickSub(k)   { whoSub = whoSub === k ? '__all__' : k; render(); }
function pickWhoCap(k){ whoCap = whoCap === k ? '__all__' : k; render(); }
function pickWhoScene(k){ whoScene = whoScene === k && k !== '__all__' ? '__all__' : k; render(); }
function setSide(v)   { side = v; render(); }
function setStale()   { showStale = !showStale; render(); }
function pickCross(c,s) {
  crossCap=c; crossScene=s; render();
  const el=document.getElementById('crossResult');
  if (el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function setCrossAxis(v) { crossAxis=v; render(); }
function pickDimension(g,kind,id) {
  dimensionGroup=g; dimensionKind=kind; dimensionId=id; render();
  const el=document.getElementById('dimensionResult');
  if (el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function setDimensionView(v) {
  dimensionView=v;
  if (v==='scene' && dimensionKind!=='scene') { dimensionKind='scene'; dimensionId='S2'; }
  if (v==='cap' && dimensionKind!=='cap') { dimensionKind='cap'; dimensionId=CAPS[0]; }
  render();
}
function pickTriple(g,c,s) {
  dimensionGroup=g; crossCap=c; crossScene=s; overviewSelection='triple'; render();
  const el=document.getElementById('tripleResult');
  if (el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function pickCapabilityType(c) {
  crossCap=c; overviewSelection='capability'; render();
  const el=document.getElementById('tripleResult');
  if (el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'start'});
}
function focusSceneCluster(s) {
  crossScene=s; overviewSelection='scene'; render();
}
function pickSceneCluster(s) {
  crossScene=s; overviewSelection='scene'; render();
  const el=document.getElementById('tripleResult');
  if (el && el.scrollIntoView) el.scrollIntoView({behavior:'smooth',block:'start'});
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDrawer(); hideTip(); } });
addEventListener('scroll', hideTip, { passive: true });

document.addEventListener('DOMContentLoaded', async () => {
  const cut = new Date();
  cut.setMonth(cut.getMonth() - STALE_MONTHS);
  STALE_CUT = cut.toISOString().slice(0,10);

  [TAX, PROFILE, CAP] = await Promise.all([
    loadCSV('taxonomy'), loadCSV('profile'), loadCSV('capability')
  ]);
  CAPS = TAX.map(t => t['能力項ID']).filter(Boolean);
  CAP_CLUSTERS = TAX.filter(t => t['能力項ID']).map(t => ({
    id: t['能力項ID'], key: t['能力項ID'], side: t['側'] === 'AI' ? 'AI' : '數金',
    name: `${t['能力項ID']} ${t['能力項']}`,
    color: t['側'] === 'AI' ? 'var(--ai)' : 'var(--fin)',
    caps: [t['能力項ID']],
  }));
  crossCap = CAP_CLUSTERS[0] ? CAP_CLUSTERS[0].id : '';
  if (!CAPS.length || !CAP.length) {
    document.getElementById('panel').innerHTML =
      '<p class="empty" style="color:var(--stop)">資料載入失敗，請確認嵌入的 CSV 區塊。</p>';
    return;
  }
  capId = CAPS[0];
  sceneId = ALL_SCENES[0];
  buildCells();
  // 預設場景挑最有內容的一個，開頁不會落在空清單上
  sceneId = ALL_SCENES.slice().sort((a,b) => sceneDone(b) - sceneDone(a))[0] || ALL_SCENES[0];
  renderTiles();
  render();
});
</script>
